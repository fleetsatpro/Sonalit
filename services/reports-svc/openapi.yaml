openapi: 3.1.0
info:
  title: Sonalit Reports Service
  version: 4.0.0
servers:
  - url: http://localhost:4009
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /v4/reports:
    get:
      operationId: listReports
      tags:
        - Reports
      summary: List reports
      security:
        - bearerAuth: []
      parameters:
        - name: x-org-id
          in: header
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: List of reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        org_id:
                          type: string
                        title:
                          type: string
                        type:
                          type: string
                          enum:
                            - convoy
                            - fleet
                            - driver
                        status:
                          type: string
                        params:
                          type: object
                          additionalProperties: true
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      operationId: createReport
      tags:
        - Reports
      summary: Request a report to be generated asynchronously
      security:
        - bearerAuth: []
      parameters:
        - name: x-org-id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - from
                - to
              properties:
                type:
                  type: string
                  enum:
                    - convoy
                    - fleet
                    - driver
                from:
                  type: string
                  pattern: '^\d{4}-\d{2}-\d{2}$'
                  example: '2025-01-01'
                to:
                  type: string
                  pattern: '^\d{4}-\d{2}-\d{2}$'
                  example: '2025-01-31'
                format:
                  type: string
                  enum:
                    - pdf
                    - csv
                  default: pdf
                params:
                  type: object
                  additionalProperties: true
      responses:
        '202':
          description: Report accepted for generation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  org_id:
                    type: string
                  title:
                    type: string
                  type:
                    type: string
                    enum:
                      - convoy
                      - fleet
                      - driver
                  status:
                    type: string
                    example: pending
                  params:
                    type: object
                    additionalProperties: true
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /v4/reports/{id}:
    get:
      operationId: getReport
      tags:
        - Reports
      summary: Get a report by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: x-org-id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Report details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  org_id:
                    type: string
                  title:
                    type: string
                  type:
                    type: string
                    enum:
                      - convoy
                      - fleet
                      - driver
                  status:
                    type: string
                  params:
                    type: object
                    additionalProperties: true
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
