openapi: 3.1.0
info:
  title: Sonalit Convoy Service
  version: 4.0.0
servers:
  - url: http://localhost:4004
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /v4/convoys:
    get:
      operationId: listConvoys
      tags:
        - Convoys
      summary: List convoys
      security:
        - bearerAuth: []
      parameters:
        - name: x-org-id
          in: header
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - draft
              - planned
              - active
              - completed
              - cancelled
      responses:
        '200':
          description: List of convoys
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        org_id:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                          nullable: true
                        timezone:
                          type: string
                        start_date:
                          type: string
                        end_date:
                          type: string
                        seal_count_per_truck:
                          type: integer
                          nullable: true
                        notes:
                          type: string
                          nullable: true
                        status:
                          type: string
                          enum:
                            - draft
                            - planned
                            - active
                            - completed
                            - cancelled
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      operationId: createConvoy
      tags:
        - Convoys
      summary: Create a convoy
      security:
        - bearerAuth: []
      parameters:
        - name: x-org-id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - start_date
                - end_date
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                description:
                  type: string
                  maxLength: 2000
                timezone:
                  type: string
                  default: UTC
                start_date:
                  type: string
                end_date:
                  type: string
                seal_count_per_truck:
                  type: integer
                  minimum: 0
                vehicle_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  default: []
                driver_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  default: []
                notes:
                  type: string
                  maxLength: 5000
      responses:
        '201':
          description: Convoy created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  org_id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  timezone:
                    type: string
                  start_date:
                    type: string
                  end_date:
                    type: string
                  seal_count_per_truck:
                    type: integer
                    nullable: true
                  notes:
                    type: string
                    nullable: true
                  status:
                    type: string
                    enum:
                      - draft
                      - planned
                      - active
                      - completed
                      - cancelled
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /v4/convoys/{id}:
    get:
      operationId: getConvoy
      tags:
        - Convoys
      summary: Get a convoy by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: x-org-id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Convoy details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  org_id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  timezone:
                    type: string
                  start_date:
                    type: string
                  end_date:
                    type: string
                  seal_count_per_truck:
                    type: integer
                    nullable: true
                  notes:
                    type: string
                    nullable: true
                  status:
                    type: string
                    enum:
                      - draft
                      - planned
                      - active
                      - completed
                      - cancelled
                  vehicle_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                  driver_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Convoy not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    patch:
      operationId: updateConvoy
      tags:
        - Convoys
      summary: Partially update a convoy
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: x-org-id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                description:
                  type: string
                  maxLength: 2000
                timezone:
                  type: string
                start_date:
                  type: string
                end_date:
                  type: string
                seal_count_per_truck:
                  type: integer
                  minimum: 0
                vehicle_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                driver_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                notes:
                  type: string
                  maxLength: 5000
                status:
                  type: string
                  enum:
                    - draft
                    - planned
                    - active
                    - completed
                    - cancelled
      responses:
        '200':
          description: Updated convoy
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  org_id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  timezone:
                    type: string
                  start_date:
                    type: string
                  end_date:
                    type: string
                  seal_count_per_truck:
                    type: integer
                    nullable: true
                  notes:
                    type: string
                    nullable: true
                  status:
                    type: string
                    enum:
                      - draft
                      - planned
                      - active
                      - completed
                      - cancelled
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Convoy not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    delete:
      operationId: deleteConvoy
      tags:
        - Convoys
      summary: Soft-delete a convoy
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: x-org-id
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Convoy deleted
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Convoy not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
