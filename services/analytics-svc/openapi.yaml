openapi: 3.1.0
info:
  title: Sonalit Analytics Service
  version: 4.0.0
servers:
  - url: http://localhost:4008
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /v4/analytics/gps-events:
    get:
      operationId: getGpsEvents
      tags:
        - Analytics
      summary: GPS event counts bucketed by hour
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: '2025-01-01'
          description: Start date (inclusive, valid calendar date). Defaults to 7 days ago; date ranges may span at most 366 days.
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: '2025-01-07'
          description: End date (inclusive, valid calendar date). Defaults to today; must be on or after from.
      responses:
        '200':
          description: Hourly GPS event counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        hour:
                          type: string
                          format: date-time
                        event_count:
                          type: string
                          description: Count as returned by the database
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /v4/analytics/alerts-by-type:
    get:
      operationId: getAlertsByType
      tags:
        - Analytics
      summary: Alert counts grouped by type and severity
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: '2025-01-01'
          description: Start date (inclusive, valid calendar date). Defaults to 7 days ago; date ranges may span at most 366 days.
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: '2025-01-07'
          description: End date (inclusive, valid calendar date). Defaults to today; must be on or after from.
      responses:
        '200':
          description: Alert counts by type and severity
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        severity:
                          type: string
                        count:
                          type: string
                          description: Count as returned by the database
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /v4/analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags:
        - Analytics
      summary: Aggregated fleet analytics summary for a date range
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: '2025-01-01'
          description: Start date (inclusive, valid calendar date). Defaults to 7 days ago; date ranges may span at most 366 days.
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: '2025-01-07'
          description: End date (inclusive, valid calendar date). Defaults to today; must be on or after from.
      responses:
        '200':
          description: Analytics summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  from:
                    type: string
                    pattern: '^\d{4}-\d{2}-\d{2}$'
                  to:
                    type: string
                    pattern: '^\d{4}-\d{2}-\d{2}$'
                  total_gps_events:
                    type: integer
                  total_distance_km:
                    type: [number, "null"]
                    description: Measured from consecutive GPS coordinate pairs only when fix cadence and movement are plausible; null when no valid segments exist.
                  distance_method:
                    type: string
                    enum: [gps_coordinate_segments]
                  distance_valid_segments:
                    type: integer
                  distance_rejected_speed_segments:
                    type: integer
                  distance_gap_excluded_segments:
                    type: integer
                  active_hours:
                    type: [integer, "null"]
                  fuel_events:
                    type: [integer, "null"]
                  geofence_violations:
                    type: [integer, "null"]
                  metric_status:
                    type: object
                    additionalProperties:
                      type: string
                      enum: [measured, unavailable]
                  metric_definitions:
                    type: object
                    additionalProperties:
                      type: string
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /v4/analytics/executive-summary:
    get:
      operationId: getExecutiveSummary
      tags:
        - Analytics
      summary: Executive-level KPIs and weekly trends for the past 8 weeks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Executive summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  fleet_utilization_pct:
                    type: [integer, "null"]
                    description: Percentage of the registered CDS fleet currently assigned to an operational trip; null when there is no registered fleet.
                  on_time_delivery_pct:
                    type: [integer, "null"]
                    description: Percentage of eligible deliveries in the last 8 weeks delivered at or before recorded ETA; null when no eligible deliveries exist.
                  safety_score:
                    type: [integer, "null"]
                    description: Null until an approved source-backed safety-scoring rule and evidence pipeline are available.
                  active_incidents:
                    type: [integer, "null"]
                    description: Current tenant-scoped incidents excluding resolved, closed, and deleted records.
                  metric_status:
                    type: object
                    additionalProperties:
                      type: string
                      enum: [measured, unavailable]
                  metric_definitions:
                    type: object
                    additionalProperties:
                      type: string
                  weekly_trends:
                    type: array
                    items:
                      type: object
                      properties:
                        week:
                          type: string
                          format: date-time
                        gps_events:
                          type: string
                          description: Count as returned by the database
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
