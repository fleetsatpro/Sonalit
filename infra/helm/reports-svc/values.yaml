image:
  repository: ghcr.io/fleetsatpro/sonalit/reports-svc
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 4008
  metricsPort: 9090

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

vault:
  enabled: true
  role: reports-svc
  secretPath: sonalit/data/reports-svc

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"
  spiffe.io/spiffeid: "spiffe://sonalit.internal/ns/sonalit-prod/sa/reports-svc"

livenessProbe:
  httpGet:
    path: /healthz/live
    port: 4008
  initialDelaySeconds: 15
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz/ready
    port: 4008
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz/ready
    port: 4008
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 30

networkPolicy:
  enabled: true
  ingressRules:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sonalit-prod
  egressRules:
    - ports:
        - port: 5432
        - port: 6379
        - port: 4222
        - port: 443
        - port: 4317
        - port: 8123

serviceMonitor:
  enabled: true
  interval: "15s"
  path: "/metrics"
  labels:
    release: prometheus

env:
  - name: SERVICE_NAME
    value: reports-svc
  - name: CLICKHOUSE_DSN
    value: "clickhouse://clickhouse.sonalit-infra.svc.cluster.local:8123/sonalit"
  - name: REPORT_TIMEOUT_SECONDS
    value: "300"

terminationGracePeriodSeconds: 120

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: reports-svc
