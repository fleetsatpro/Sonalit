image:
  repository: ghcr.io/fleetsatpro/sonalit/analytics-svc
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 4009
  metricsPort: 9090

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

vault:
  enabled: true
  role: analytics-svc
  secretPath: sonalit/data/analytics-svc

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"
  spiffe.io/spiffeid: "spiffe://sonalit.internal/ns/sonalit-prod/sa/analytics-svc"

livenessProbe:
  httpGet:
    path: /healthz/live
    port: 4009
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz/ready
    port: 4009
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz/ready
    port: 4009
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 30

networkPolicy:
  enabled: true
  ingressRules:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sonalit-prod
  egressRules:
    - ports:
        - port: 5432
        - port: 6379
        - port: 4222
        - port: 443
        - port: 4317
        - port: 8123

serviceMonitor:
  enabled: true
  interval: "15s"
  path: "/metrics"
  labels:
    release: prometheus

env:
  - name: SERVICE_NAME
    value: analytics-svc
  - name: CLICKHOUSE_DSN
    value: "clickhouse://clickhouse.sonalit-infra.svc.cluster.local:8123/sonalit"

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: analytics-svc
