image:
  repository: ghcr.io/fleetsatpro/sonalit/telemetry-ingest-svc
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 4005
  metricsPort: 9090

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "4000m"
    memory: "4Gi"

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 50
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 3

priorityClassName: high-priority

nodeSelector:
  role: hotpath

tolerations:
  - key: role
    operator: Equal
    value: hotpath
    effect: NoSchedule

vault:
  enabled: true
  role: telemetry-ingest-svc
  secretPath: sonalit/data/telemetry-ingest-svc

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"
  spiffe.io/spiffeid: "spiffe://sonalit.internal/ns/sonalit-prod/sa/telemetry-ingest-svc"

livenessProbe:
  httpGet:
    path: /healthz/live
    port: 4005
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz/ready
    port: 4005
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz/ready
    port: 4005
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 30

networkPolicy:
  enabled: true
  ingressRules:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sonalit-prod
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
  egressRules:
    - ports:
        - port: 5432
        - port: 6379
        - port: 4222
        - port: 443
        - port: 4317
        - port: 9000

serviceMonitor:
  enabled: true
  interval: "15s"
  path: "/metrics"
  labels:
    release: prometheus

env:
  - name: SERVICE_NAME
    value: telemetry-ingest-svc
  - name: NATS_STREAM
    value: TELEMETRY
  - name: BATCH_SIZE
    value: "500"

terminationGracePeriodSeconds: 60

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: telemetry-ingest-svc
