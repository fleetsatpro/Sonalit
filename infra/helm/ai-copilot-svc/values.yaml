image:
  repository: ghcr.io/fleetsatpro/sonalit/ai-copilot-svc
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 4011
  metricsPort: 9090

resources:
  requests:
    cpu: "300m"
    memory: "512Mi"
  limits:
    cpu: "1500m"
    memory: "2Gi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

vault:
  enabled: true
  role: ai-copilot-svc
  secretPath: sonalit/data/ai-copilot-svc

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"
  spiffe.io/spiffeid: "spiffe://sonalit.internal/ns/sonalit-prod/sa/ai-copilot-svc"

livenessProbe:
  httpGet:
    path: /healthz/live
    port: 4011
  initialDelaySeconds: 20
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz/ready
    port: 4011
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz/ready
    port: 4011
  initialDelaySeconds: 15
  periodSeconds: 5
  failureThreshold: 30

networkPolicy:
  enabled: true
  ingressRules:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sonalit-prod
  egressRules:
    - ports:
        - port: 5432
        - port: 6379
        - port: 4222
        - port: 443
        - port: 4317
        - port: 8123

serviceMonitor:
  enabled: true
  interval: "15s"
  path: "/metrics"
  labels:
    release: prometheus

env:
  - name: SERVICE_NAME
    value: ai-copilot-svc
  - name: LLM_PROVIDER
    value: anthropic
  - name: LLM_MODEL
    value: claude-sonnet-4-5
  - name: INFERENCE_TIMEOUT_SECONDS
    value: "30"

terminationGracePeriodSeconds: 60

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: ai-copilot-svc
