image:
  repository: ghcr.io/fleetsatpro/sonalit/realtime-gateway-svc
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 4010
  metricsPort: 9090

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "2000m"
    memory: "2Gi"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 30
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 2

priorityClassName: high-priority

vault:
  enabled: true
  role: realtime-gateway-svc
  secretPath: sonalit/data/realtime-gateway-svc

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"
  spiffe.io/spiffeid: "spiffe://sonalit.internal/ns/sonalit-prod/sa/realtime-gateway-svc"

livenessProbe:
  httpGet:
    path: /healthz/live
    port: 4010
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz/ready
    port: 4010
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz/ready
    port: 4010
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 30

networkPolicy:
  enabled: true
  ingressRules:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sonalit-prod
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
  egressRules:
    - ports:
        - port: 5432
        - port: 6379
        - port: 4222
        - port: 443
        - port: 4317
        - port: 8000

serviceMonitor:
  enabled: true
  interval: "15s"
  path: "/metrics"
  labels:
    release: prometheus

env:
  - name: SERVICE_NAME
    value: realtime-gateway-svc
  - name: CENTRIFUGO_ENDPOINT
    value: "http://centrifugo.sonalit-infra.svc.cluster.local:8000"
  - name: MAX_CONNECTIONS
    value: "50000"

terminationGracePeriodSeconds: 60

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: realtime-gateway-svc
