services:
  sonalit-standby:
    image: ghcr.io/fleetsatpro/sonalit-backend:standby
    container_name: sonalit-standby
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      SONALIT_STANDBY: "true"
      ENABLE_INPROCESS_WORKERS: "false"
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
