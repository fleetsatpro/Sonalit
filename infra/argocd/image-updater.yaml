apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
data:
  registries.conf: |
    registries:
      - name: GitHub Container Registry
        api_url: https://ghcr.io
        prefix: ghcr.io
        credentials: secret:argocd/ghcr-credentials#token
        default_ns: fleetsatpro
        insecure: false
        tag_semver_ignorev: true

  applications.yaml: |
    applications:
      - name: auth-svc
        namespace: argocd
        image_list:
          - alias: auth-svc
            image: ghcr.io/fleetsatpro/auth-svc
            update_strategy: semver
            allow_tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
            ignore_tags:
              - latest
              - dev
              - sha-.*
            helm_parameter_name: image.tag

      - name: fleet-svc
        namespace: argocd
        image_list:
          - alias: fleet-svc
            image: ghcr.io/fleetsatpro/fleet-svc
            update_strategy: semver
            allow_tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
            ignore_tags:
              - latest
              - dev
              - sha-.*
            helm_parameter_name: image.tag

      - name: alerts-svc
        namespace: argocd
        image_list:
          - alias: alerts-svc
            image: ghcr.io/fleetsatpro/alerts-svc
            update_strategy: semver
            allow_tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
            ignore_tags:
              - latest
              - dev
              - sha-.*
            helm_parameter_name: image.tag

      - name: convoy-svc
        namespace: argocd
        image_list:
          - alias: convoy-svc
            image: ghcr.io/fleetsatpro/convoy-svc
            update_strategy: semver
            allow_tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
            ignore_tags:
              - latest
              - dev
              - sha-.*
            helm_parameter_name: image.tag

      - name: guardian-svc
        namespace: argocd
        image_list:
          - alias: guardian-svc
            image: ghcr.io/fleetsatpro/guardian-svc
            update_strategy: semver
            allow_tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
            ignore_tags:
              - latest
              - dev
              - sha-.*
            helm_parameter_name: image.tag

      - name: media-svc
        namespace: argocd
        image_list:
          - alias: media-svc
            image: ghcr.io/fleetsatpro/media-svc
            update_strategy: semver
            allow_tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
            ignore_tags:
              - latest
              - dev
              - sha-.*
            helm_parameter_name: image.tag

      - name: notification-svc
        namespace: argocd
        image_list:
          - alias: notification-svc
            image: ghcr.io/fleetsatpro/notification-svc
            update_strategy: semver
            allow_tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
            ignore_tags:
              - latest
              - dev
              - sha-.*
            helm_parameter_name: image.tag

      - name: analytics-svc
        namespace: argocd
        image_list:
          - alias: analytics-svc
            image: ghcr.io/fleetsatpro/analytics-svc
            update_strategy: semver
            allow_tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
            ignore_tags:
              - latest
              - dev
              - sha-.*
            helm_parameter_name: image.tag

      - name: reports-svc
        namespace: argocd
        image_list:
          - alias: reports-svc
            image: ghcr.io/fleetsatpro/reports-svc
            update_strategy: semver
            allow_tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
            ignore_tags:
              - latest
              - dev
              - sha-.*
            helm_parameter_name: image.tag

      - name: ai-copilot-svc
        namespace: argocd
        image_list:
          - alias: ai-copilot-svc
            image: ghcr.io/fleetsatpro/ai-copilot-svc
            update_strategy: semver
            allow_tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
            ignore_tags:
              - latest
              - dev
              - sha-.*
            helm_parameter_name: image.tag

      - name: telemetry-ingest-svc
        namespace: argocd
        image_list:
          - alias: telemetry-ingest-svc
            image: ghcr.io/fleetsatpro/telemetry-ingest-svc
            update_strategy: semver
            allow_tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
            ignore_tags:
              - latest
              - dev
              - sha-.*
            helm_parameter_name: image.tag

      - name: realtime-gateway-svc
        namespace: argocd
        image_list:
          - alias: realtime-gateway-svc
            image: ghcr.io/fleetsatpro/realtime-gateway-svc
            update_strategy: semver
            allow_tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
            ignore_tags:
              - latest
              - dev
              - sha-.*
            helm_parameter_name: image.tag

  log.level: info
  git.commit-message-template: |
    build: update {{.AppName}} image to {{.NewImageTag}}

    Updated by Argo CD Image Updater
    Old tag: {{.OldImageTag}}
    Registry: {{.Image}}
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-credentials
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd-image-updater
type: Opaque
stringData:
  token: GHCR_TOKEN_PLACEHOLDER
