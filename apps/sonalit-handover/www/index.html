<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B111C" />
  <title>Sonalit Handover</title>
  <style>
    html,body{height:100%;margin:0;background:#0B111C;color:#EAEFF6;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      -webkit-font-smoothing:antialiased;}
    .wrap{height:100%;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:16px;text-align:center;padding:24px;}
    .logo{width:132px;height:132px;object-fit:contain;}
    .brand{font-weight:800;letter-spacing:6px;font-size:22px;}
    .brand b{color:#f5a623;}
    .tag{font-size:11px;letter-spacing:3px;color:#37e6ff;font-weight:600;}
    .sub{color:#8A93A6;font-size:12px;letter-spacing:1px;margin-top:6px;}
    .spin{width:24px;height:24px;border-radius:50%;border:2px solid #1c1c1c;
      border-top-color:#f5a623;animation:s .8s linear infinite;}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <!--
    Shown only before the hosted /handover surface loads (first launch or offline).
    The real app lives at server.url in capacitor.config.ts.
  -->
  <div class="wrap">
    <img class="logo" src="logo.png" alt="Sonalit Handover" />
    <div class="brand">SON<b>A</b>LIT</div>
    <div class="tag">HANDOVER</div>
    <div class="spin"></div>
    <div class="sub">Connecting…</div>
  </div>
</body>
</html>
