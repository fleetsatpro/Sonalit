<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B111C" />
  <title>Sonalit</title>
  <style>
    html,body{height:100%;margin:0;background:#0B111C;color:#EAEFF6;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      -webkit-font-smoothing:antialiased;}
    .wrap{height:100%;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:22px;text-align:center;padding:24px;}
    .brand{font-weight:800;letter-spacing:6px;font-size:22px;}
    .brand b{color:#F0B429;}
    .sub{color:#8A93A6;font-size:13px;letter-spacing:1px;}
    .spin{width:26px;height:26px;border-radius:50%;border:2px solid #1c2740;
      border-top-color:#F0B429;animation:s .8s linear infinite;}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <!--
    Shown only before the hosted site loads (first launch) or if the device is
    offline. The app itself lives at server.url (see capacitor.config.ts).
  -->
  <div class="wrap">
    <svg width="72" height="72" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2 3 6v6c0 5 3.8 8.7 9 10 5.2-1.3 9-5 9-10V6l-9-4Z"
            fill="#F0B429" stroke="#8A6410" stroke-width="0.4" stroke-linejoin="round"/>
      <path d="M8.4 12.1l2.5 2.5 4.9-5.1" fill="none" stroke="#0B111C"
            stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="brand">SON<b>A</b>LIT</div>
    <div class="spin"></div>
    <div class="sub">Connecting to your operations console…</div>
  </div>
</body>
</html>
