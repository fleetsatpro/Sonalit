version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fleetops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleetops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fleetops_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: fleetops_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@postgres:5432/fleetops
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-openssl-rand-base64-32}
      JWT_EXPIRE: 24h
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      LOG_LEVEL: info
      SPEED_ALERT_THRESHOLD: 120
      GEOFENCE_RADIUS_KM: 5
      ALERT_COOLDOWN_MINUTES: 10
      MAX_QUEUE_RETRIES: 3
    ports:
      - '5000:5000'
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
  redis_data:
