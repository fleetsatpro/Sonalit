plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sonalit.pegagent'
    compileSdk 34

    defaultConfig {
        applicationId "com.sonalit.pegagent"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile     file(System.getenv("KEYSTORE_PATH") ?: "pegagent-release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias      System.getenv("KEY_ALIAS") ?: "pegagent"
            keyPassword   System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }
}

dependencies {
    // AndroidX core
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.3'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    // work-runtime was only needed by Firebase — removed with Firebase
    // implementation 'androidx.work:work-runtime:2.9.0'

    // Networking - OkHttp + Retrofit
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // JSON
    implementation 'com.google.code.gson:gson:2.11.0'

    // Firebase FCM — disabled until google-services.json is configured;
    // re-enable by uncommenting and adding PEGAGENT_GOOGLE_SERVICES_JSON secret
    // implementation 'com.google.firebase:firebase-messaging:24.0.0'
    // implementation 'com.google.firebase:firebase-analytics:22.0.2'

    // Location
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // WebSocket (Centrifugo) - using OkHttp WebSocket
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'

    // Logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // QR enrollment — ML Kit barcode scanning + CameraX
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    testImplementation 'junit:junit:4.13.2'
}

// google-services plugin only needed when firebase-messaging is re-enabled
