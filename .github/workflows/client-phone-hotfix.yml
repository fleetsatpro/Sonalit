name: Client phone hotfix

on:
  push:
    branches: [fix/client-phone-hotfix]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch phone validators
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/ClientOnboardingV3.tsx')
          s = p.read_text()
          old = r'/^\\+?[0-9][0-9 ()-]{6,}$/'
          new = r'/^\+?[0-9][0-9 ()-]{6,}$/'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 malformed validators, found {count}')
          p.write_text(s.replace(old, new))
          print(f'Patched {count} validators')
          PY
      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('apps/web/src/pages/ClientOnboardingV3.tsx').read_text()
          good = r'/^\+?[0-9][0-9 ()-]{6,}$/'
          bad = r'/^\\+?[0-9][0-9 ()-]{6,}$/'
          assert s.count(good) == 2
          assert bad not in s
          print('Static verification passed')
          PY
      - name: Commit and push
        run: |
          git config user.name 'Sonalit Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/web/src/pages/ClientOnboardingV3.tsx
          git commit -m 'fix: unblock valid client phone onboarding [skip ci]'
          git push origin HEAD:fix/client-phone-hotfix
