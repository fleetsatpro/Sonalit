name: Client phone onboarding hotfix

on:
  push:
    branches:
      - fix/client-phone-normalization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch the two onboarding validators
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('apps/web/src/pages/ClientOnboardingV3.tsx')
          s = p.read_text()
          pattern = r'/\^.*?\$/\.test\(form\.phone\.trim\(\)\)'
          replacement = r'/^\+?[0-9][0-9 ()-]{6,}$/.test(form.phone.trim())'
          matches = list(re.finditer(pattern, s))
          if len(matches) != 2:
              raise SystemExit(f'Expected exactly 2 phone validators, found {len(matches)}')
          s2 = re.sub(pattern, replacement, s)
          p.write_text(s2)
          print('Patched 2 phone validators')
          PY

      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('apps/web/src/pages/ClientOnboardingV3.tsx').read_text()
          expected = r'/^\+?[0-9][0-9 ()-]{6,}$/.test(form.phone.trim())'
          if s.count(expected) != 2:
              raise SystemExit(f'Expected 2 corrected validators, found {s.count(expected)}')
          print('Phone validation hotfix verified in source')
          PY
          git diff --check

      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/pages/ClientOnboardingV3.tsx
          git diff --cached --check
          git commit -m 'fix: unblock valid client phone numbers during onboarding'
          git push origin HEAD:fix/client-phone-normalization
