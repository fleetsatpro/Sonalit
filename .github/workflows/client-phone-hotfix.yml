name: Client phone hotfix

on:
  push:
    branches: [fix/client-phone-normalization]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch malformed phone regex
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/ClientOnboardingV3.tsx')
          s = p.read_text()
          old = r'/^\\\\+?[0-9][0-9 ()-]{6,}$/'
          new = r'/^\\+?[0-9][0-9 ()-]{6,}$/'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 malformed regex occurrences, found {count}')
          p.write_text(s.replace(old, new))
          print(f'Patched {count} phone validators')
          PY

      - name: Verify source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('apps/web/src/pages/ClientOnboardingV3.tsx').read_text()
          bad = r'/^\\\\+?[0-9][0-9 ()-]{6,}$/'
          good = r'/^\\+?[0-9][0-9 ()-]{6,}$/'
          if bad in s:
              raise SystemExit('Malformed regex still present')
          if s.count(good) != 2:
              raise SystemExit(f'Expected 2 corrected validators, found {s.count(good)}')
          print('Phone validation source check passed')
          PY

      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/pages/ClientOnboardingV3.tsx
          git diff --cached --check
          git commit -m 'fix: accept valid phone numbers during client onboarding'
          git push origin HEAD:fix/client-phone-normalization

      - name: Remove one-shot workflow
        if: ${{ success() }}
        run: |
          git rm .github/workflows/client-phone-hotfix.yml
          git commit -m 'chore: remove one-shot phone hotfix workflow'
          git push origin HEAD:fix/client-phone-normalization
