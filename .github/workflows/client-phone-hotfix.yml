name: Client phone onboarding hotfix

on:
  push:
    branches:
      - hotfix/client-phone-onboarding-20260908

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/client_phone_hotfix.py
      - name: Verify
        run: |
          node --check backend/src/utils/phone.js
          node --check backend/src/routes/portalClients.js
          node - <<'JS'
          const { normalizePhone } = require('./backend/src/utils/phone');
          const cases = [['0712345678','+254712345678'],['+254712345678','+254712345678'],['+254 712 345 678','+254712345678'],['+254-712-345-678','+254712345678']];
          for (const [input, expected] of cases) if (normalizePhone(input, 'Kenya') !== expected) throw new Error(input);
          for (const input of ['123','abc712345678','+','07abc345678']) { let rejected=false; try { normalizePhone(input,'Kenya'); } catch { rejected=true; } if (!rejected) throw new Error('accepted '+input); }
          console.log('Phone normalization checks passed.');
          JS
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/utils/phone.js backend/src/routes/portalClients.js backend/migrations/20260908_107_client_phone_normalization.sql apps/web/src/pages/ClientOnboardingV3.tsx
          git diff --cached --check
          git commit -m "fix: unblock client phone onboarding" || exit 0
          git push origin HEAD:hotfix/client-phone-onboarding-20260908
