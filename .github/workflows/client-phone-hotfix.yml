name: Client phone onboarding hotfix

on:
  push:
    branches:
      - fix/client-phone-normalization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 -c "from pathlib import Path; p=Path('apps/web/src/pages/ClientOnboardingV3.tsx'); s=p.read_text(); old='const phoneValid = /^\\\\+?[0-9][0-9 ()-]{6,}$/.test(form.phone.trim());'; new='const phoneValid = /^\\+?[0-9][0-9 ()-]{6,}$/.test(form.phone.trim());'; assert s.count(old)==1; s=s.replace(old,new,1); old2=\"if (!/^\\\\+?[0-9][0-9 ()-]{6,}$/.test(form.phone.trim())) throw new Error('Enter a valid primary contact phone number.');\"; new2=\"if (!/^\\+?[0-9][0-9 ()-]{6,}$/.test(form.phone.trim())) throw new Error('Enter a valid primary contact phone number.');\"; assert s.count(old2)==1; p.write_text(s.replace(old2,new2,1))"
      - name: Verify
        run: |
          grep -n "phoneValid\|valid primary contact phone" apps/web/src/pages/ClientOnboardingV3.tsx
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/pages/ClientOnboardingV3.tsx
          git commit -m 'fix(client): restore valid phone number onboarding'
          git push origin HEAD:fix/client-phone-normalization
