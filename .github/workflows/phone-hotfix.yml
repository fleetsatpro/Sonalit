name: Client phone hotfix
on:
  push:
    branches:
      - fix/client-phone-normalization
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/ClientOnboardingV3.tsx')
          s = p.read_text()
          old = '/^\\\\+?[0-9][0-9 ()-]{6,}$/'
          new = '/^\\+?[0-9][0-9 ()-]{6,}$/'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 malformed validators, found {count}')
          p.write_text(s.replace(old, new))
          PY
          git diff --check
          grep -nF '/^\\+?[0-9][0-9 ()-]{6,}$/' apps/web/src/pages/ClientOnboardingV3.tsx
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/pages/ClientOnboardingV3.tsx
          git commit -m 'fix: accept valid client phone numbers during onboarding'
          git push origin HEAD:fix/client-phone-normalization
