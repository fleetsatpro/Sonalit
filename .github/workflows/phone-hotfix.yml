name: Client phone hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - fix/client-phone-normalization

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch phone validation
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/web/src/pages/ClientOnboardingV3.tsx')
          s = p.read_text()
          old = r"/^\\+?[0-9][0-9 ()-]{6,}$/"
          if old not in s:
              raise SystemExit('Expected malformed phone regex was not found; refusing to modify source')
          new = r"/^\\+?[0-9][0-9 ()-]{6,}$/"
          # Replace the malformed source representation with the intended regex literal.
          new = '/^\\+?[0-9][0-9 ()-]{6,}$/'
          s2 = s.replace(old, new)
          if s2 == s:
              raise SystemExit('No change made')
          p.write_text(s2)
      - name: Verify
        run: |
          grep -n "\\+?\[0-9\]" apps/web/src/pages/ClientOnboardingV3.tsx
          git diff --check
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/ClientOnboardingV3.tsx
          git commit -m "fix: accept valid client phone numbers during onboarding"
          git push origin HEAD:fix/client-phone-normalization
