name: repair-intelligence-build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[intelligence-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair IntelligenceCentre TypeScript blockers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/IntelligenceCentre.tsx')
          s = p.read_text()
          s = s.replace('Activity, ArrowUpRight, BookOpen, ChevronRight, CircleDot, FileText, Filter, Globe2, Layers3, Map, Radar, RefreshCw, Search, ShieldAlert, Signal, Target, Truck, Users, X', 'Activity, BookOpen, ChevronRight, CircleDot, FileText, Globe2, Map as MapIcon, Radar, RefreshCw, Search, Signal, Target, Truck, X')
          s = s.replace("import { useRiskTicker } from '../features/risk-intel/hooks/useRiskTicker.js'\n", '')
          s = s.replace("{id:'atlas',label:'ATLAS',icon:Map}", "{id:'atlas',label:'ATLAS',icon:MapIcon}")
          s = s.replace("function Investigations({storylines,gaps,events}:{storylines:GenericRecord[];gaps:GenericRecord[];events:Event[]})", "function Investigations({storylines,gaps}:{storylines:GenericRecord[];gaps:GenericRecord[]})")
          s = s.replace("<Investigations storylines={storylines} gaps={gaps} events={events}/>", "<Investigations storylines={storylines} gaps={gaps}/>")
          s = s.replace("k.replaceAll('_',' ')", "k.replace(/_/g,' ')")
          s = s.replace("const zonesQ=useRiskZones(continent),feedQ=useLiveFeed(continent),tickerQ=useRiskTicker(continent),convoysQ=useRiskConvoys(continent)", "const zonesQ=useRiskZones(continent),feedQ=useLiveFeed(continent),convoysQ=useRiskConvoys(continent)")
          p.write_text(s)
          PY
      - name: Commit repaired source and remove repair workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/pages/IntelligenceCentre.tsx
          git commit -m 'fix(intelligence): clear TypeScript build blockers [intelligence-repair]'
          git push
          git rm .github/workflows/repair-intelligence-build.yml
          git commit -m 'chore: remove temporary intelligence repair workflow [intelligence-repair]'
          git push
