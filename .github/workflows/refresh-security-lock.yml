name: Refresh security lockfile

on:
  push:
    branches: ["fix/ci-real-dependency-audit"]

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.4

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Refresh lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile --force

      - name: Assert patched dependency graph
        shell: bash
        run: |
          set -euo pipefail
          for needle in             "nodemailer@10."             "joi@17.13.7"             "sharp@0.35.4"             "websocket-driver@0.7.5"             "proxy-addr@2.0.8"             "ws@8.21.0"             "protobufjs@7.6.1"             "brace-expansion@2.1.6"             "socket.io-parser@4.2.7"             "ip-address@10.3.1"             "engine.io@6.6.10"             "@grpc/grpc-js@1.14.5"             "@fastify/busboy@3.2.1"; do
            grep -q "$needle" pnpm-lock.yaml || { echo "Missing patched lock entry: $needle"; exit 1; }
          done

      - name: Commit regenerated lockfile
        id: commit
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add pnpm-lock.yaml
          git commit -m "chore(security): regenerate dependency lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch full CI for regenerated lockfile
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run node.js.yml --ref "${GITHUB_REF_NAME}"
