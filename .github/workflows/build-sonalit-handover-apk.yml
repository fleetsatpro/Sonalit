name: Build Sonalit Handover APK

# Sonalit Handover is the Handover Officer's Capacitor shell (apps/sonalit-handover).
# Like the operator app, it loads the hosted web app, so /handover UI changes ship
# via the web deploy — this workflow only rebuilds when the shell itself
# changes (or on manual dispatch).
on:
  push:
    branches: [main]
    paths:
      - 'apps/sonalit-handover/**'
      - '.github/workflows/build-sonalit-handover-apk.yml'
  pull_request:
    paths:
      - 'apps/sonalit-handover/**'
      - '.github/workflows/build-sonalit-handover-apk.yml'
  workflow_dispatch:

concurrency:
  group: sonalit-handover-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: apps/sonalit-handover
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        working-directory: apps/sonalit-handover
        run: npx cap add android

      # Handover-team branding: amber background matches the accent used in
      # the /handover UI so the launcher icon reads as distinct from the
      # general Sonalit operator app and Sonalit Field on the same device.
      - name: Generate launcher icon + splash
        working-directory: apps/sonalit-handover
        run: >
          npx @capacitor/assets generate --android
          --iconBackgroundColor '#f5a623' --iconBackgroundColorDark '#f5a623'
          --splashBackgroundColor '#0B111C' --splashBackgroundColorDark '#0B111C'

      - name: Sync web shell into Android
        working-directory: apps/sonalit-handover
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default is "tools platform-tools". The obsolete "tools" package drags
          # in the ~300MB Android Emulator, whose download intermittently arrives
          # corrupt ("Error on ZipFile unknown archive") and fails the whole job.
          # Nothing here emulates anything — the next step installs the build-tools
          # and platform this build actually needs.
          packages: 'platform-tools'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install platform and build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-35"

      - name: Set local.properties
        working-directory: apps/sonalit-handover/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -f variables.gradle ]; then
            sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' variables.gradle
          fi

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > apps/sonalit-handover/android/app/release.keystore

      - name: Inject release signing config
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        working-directory: apps/sonalit-handover/android/app
        run: |
          sed -i '/android {/a\
              signingConfigs {\
                  release {\
                      storeFile file("release.keystore")\
                      storePassword System.getenv("KEYSTORE_PASSWORD")\
                      keyAlias System.getenv("KEY_ALIAS")\
                      keyPassword System.getenv("KEY_PASSWORD")\
                  }\
              }' build.gradle
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' build.gradle

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-sonalit-handover-gradle-${{ hashFiles('apps/sonalit-handover/android/**/*.gradle*', 'apps/sonalit-handover/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-sonalit-handover-gradle-

      - name: Make gradlew executable
        run: chmod +x apps/sonalit-handover/android/gradlew

      - name: Build APK
        working-directory: apps/sonalit-handover/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f app/release.keystore ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate and rename APK
        run: |
          if [ -f apps/sonalit-handover/android/app/build/outputs/apk/release/app-release.apk ]; then
            mv apps/sonalit-handover/android/app/build/outputs/apk/release/app-release.apk \
               apps/sonalit-handover/android/app/build/outputs/apk/sonalit-handover.apk
          else
            mv apps/sonalit-handover/android/app/build/outputs/apk/debug/app-debug.apk \
               apps/sonalit-handover/android/app/build/outputs/apk/sonalit-handover.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SonalitHandover
          path: apps/sonalit-handover/android/app/build/outputs/apk/sonalit-handover.apk
          retention-days: 7

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sonalit-handover-v${{ github.run_number }}
          name: Sonalit Handover v${{ github.run_number }}
          body: |
            Sonalit Handover APK — Handover Officers — auto-built from commit ${{ github.sha }}.

            **Install**: Download and open on an Android 7.0+ device (enable "Install unknown apps" in settings). Installing a newer build over an older one is an in-place update — no uninstall needed.

            **What it does**: lists convoys awaiting handover (status "completing"), lets you pick a convoy — or an individual truck, for convoys handed over truck-by-truck — and upload the signed handover form. Submitting it signs the convoy off; once every truck (or the whole convoy) is covered, the convoy is marked complete automatically.

            Convoys flagged as a local consignment don't appear here — their CFO hands those over directly from the Guardian app.

            **Sign in** with your regular Sonalit credentials. Each handover is attributed to the signed-in user.

            **Updates**: This app loads the live /handover surface, so UI and workflow changes appear automatically on next open. You only need a new APK for rare native changes (new Capacitor plugins, permissions).
          files: apps/sonalit-handover/android/app/build/outputs/apk/sonalit-handover.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
