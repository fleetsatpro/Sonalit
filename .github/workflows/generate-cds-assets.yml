name: Generate CDS Artwork

# Manual only. Video generation is billed per second and takes minutes per shot,
# and the output needs a human eye — so this never fires on push. You click Run,
# it opens a PR with the footage for review.
#
# Requires the OPENAI_API_KEY repo secret. Sora access varies by account tier;
# if the video step reports model_not_found, run with skip_video to at least get
# the icon, and tell me which video provider you do have.
on:
  workflow_dispatch:
    inputs:
      video_model:
        description: 'Video model'
        required: false
        default: 'sora-2'
        type: string
      video_seconds:
        description: 'Seconds per shot'
        required: false
        default: '8'
        type: string
      skip_video:
        description: 'Icon only — skip the intro film'
        required: false
        default: false
        type: boolean

jobs:
  generate:
    runs-on: ubuntu-latest
    # Four Sora renders at ~minutes each, plus polling.
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate artwork
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VIDEO_MODEL: ${{ inputs.video_model }}
          VIDEO_SECONDS: ${{ inputs.video_seconds }}
          SKIP_VIDEO: ${{ inputs.skip_video && '1' || '0' }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is not set — add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          node scripts/generate-cds-assets.mjs

      - name: Open PR with the artwork
        uses: peter-evans/create-pull-request@v7
        with:
          branch: cds-artwork/${{ github.run_number }}
          commit-message: 'assets(cds): generated intro film + icon'
          title: 'assets(cds): generated CDS artwork (run ${{ github.run_number }})'
          body: |
            Generated by `.github/workflows/generate-cds-assets.yml`
            (video: `${{ inputs.video_model }}`, ${{ inputs.video_seconds }}s per shot).

            **Watch the footage before merging.** If a shot looks CGI or cartoonish,
            adjust its prompt in `scripts/generate-cds-assets.mjs` and re-run rather
            than merging something mediocre — the prompts carry an explicit
            live-action/35mm grade for exactly this reason.

            - `cds-icon.png` — cargo ship + truck, for the folder and sidebar
            - `intro-0*.mp4` — four continuous shots, cross-dissolved by the player

            Transitions are done in `CDSIntro.tsx` by overlapping two playing
            videos, not baked into the clips — asking a model for a transition is
            what produces the swipe-wipe look.
          add-paths: |
            apps/web/public/cds/*.png
            apps/web/public/cds/*.mp4
