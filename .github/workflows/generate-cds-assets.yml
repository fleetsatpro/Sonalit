name: Generate CDS Artwork

# Manual only. Image generation costs money per run and the output needs a human
# eye, so this never fires on push — you click Run, it opens a PR with the
# artwork for review.
#
# Requires the OPENAI_API_KEY repo secret.
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Image model'
        required: false
        default: 'gpt-image-1'
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate artwork
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_MODEL: ${{ inputs.model }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is not set — add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          node scripts/generate-cds-assets.mjs

      - name: Open PR with the artwork
        uses: peter-evans/create-pull-request@v7
        with:
          branch: cds-artwork/${{ github.run_number }}
          commit-message: 'assets(cds): generated container ship + truck artwork'
          title: 'assets(cds): generated CDS artwork (run ${{ github.run_number }})'
          body: |
            Generated by `.github/workflows/generate-cds-assets.yml` using
            `${{ inputs.model }}`.

            Look at the images before merging — if they aren't right, adjust the
            prompts in `scripts/generate-cds-assets.mjs` and run the workflow
            again rather than merging something mediocre.

            - `cds-icon.png` — cargo ship + truck, for the folder and sidebar
            - `intro-0*.png` — four cinematic frames for the CDS intro
          add-paths: apps/web/public/cds/*.png
