name: PEGAGENT APK Build & Release

on:
  push:
    branches: [ main, claude/new-session-nwpd35 ]
    paths:
      - 'android/PEGAGENT/**'
      - '.github/workflows/pegagent-release.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Build Signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Write google-services.json
        working-directory: android/PEGAGENT/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.PEGAGENT_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > google-services.json
            echo "google-services.json written from secret"
          else
            echo "PEGAGENT_GOOGLE_SERVICES_JSON not set — FCM will be disabled in this build"
          fi

      - name: Write keystore
        working-directory: android/PEGAGENT/app
        env:
          KEYSTORE_B64: ${{ secrets.PEGAGENT_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > pegagent-release.keystore

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-pegagent-${{ hashFiles('android/PEGAGENT/**/*.gradle*', 'android/PEGAGENT/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-pegagent-

      - name: Grant gradlew permission
        working-directory: android/PEGAGENT
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: android/PEGAGENT
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/PEGAGENT/app/pegagent-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.PEGAGENT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: pegagent
          KEY_PASSWORD: ${{ secrets.PEGAGENT_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -x lintVitalRelease \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease \
            -x generateReleaseLintVitalReportModel \
            --no-daemon \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/PEGAGENT/app/build/outputs/apk/release/app-release.apk dist/PEGAGENT.apk
          APK_SIZE=$(du -sh dist/PEGAGENT.apk | cut -f1)
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV

      - name: Get version info
        id: version
        run: |
          VERSION=$(grep 'versionName' android/PEGAGENT/app/build.gradle | grep -o '"[^"]*"' | tr -d '"' | head -1)
          BUILD_NUM=$(grep 'versionCode' android/PEGAGENT/app/build.gradle | grep -o '[0-9]*' | head -1)
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="pegagent-v${VERSION}-$(date +'%Y%m%d%H%M')"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "PEGAGENT ${{ steps.version.outputs.VERSION }} (Build ${{ steps.version.outputs.BUILD_NUM }})"
          body: |
            ## PEGAGENT Android Agent
            **Version:** ${{ steps.version.outputs.VERSION }}
            **Build:** ${{ steps.version.outputs.BUILD_NUM }}
            **Commit:** ${{ steps.version.outputs.COMMIT_SHA }}
            **Size:** ${{ env.APK_SIZE }}

            ### Installation
            ```
            adb install PEGAGENT.apk
            adb shell dpm set-device-owner com.sonalit.pegagent/.services.PegDeviceAdminReceiver
            ```

            ### Commands supported
            `request_location` · `trigger_siren` · `lock_screen` · `force_checkin`
            `restart_app` · `clear_app_data` · `remote_wipe` · `knox:start_session`
            `knox:end_session` · `inject_touch` · `inject_key` · `ping`
          files: dist/PEGAGENT.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PEGAGENT_LATEST_VERSION on Railway
        if: success()
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN not set — skipping Railway update"
            exit 0
          fi

          DISCOVER=$(curl -sf -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ me { projects { edges { node { id name environments { edges { node { id name } } } } } } } }"}') || true

          PROJECT_ID=$(echo "$DISCOVER" | jq -r '.data.me.projects.edges[0].node.id' 2>/dev/null || echo "")
          ENV_ID=$(echo "$DISCOVER" | jq -r '[.data.me.projects.edges[0].node.environments.edges[] | select(.node.name == "production")] | .[0].node.id' 2>/dev/null || echo "")
          if [ "$ENV_ID" = "null" ] || [ -z "$ENV_ID" ]; then
            ENV_ID=$(echo "$DISCOVER" | jq -r '.data.me.projects.edges[0].node.environments.edges[0].node.id' 2>/dev/null || echo "")
          fi

          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "Could not discover Railway project ID — skipping"
            exit 0
          fi

          curl -sf -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { variableUpsert(input: { projectId: \\\"$PROJECT_ID\\\", environmentId: \\\"$ENV_ID\\\", name: \\\"PEGAGENT_LATEST_VERSION\\\", value: \\\"$VERSION\\\" }) }\"}" || true
          echo "Railway PEGAGENT_LATEST_VERSION set to $VERSION"
