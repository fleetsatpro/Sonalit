name: One-shot client phone production hotfix

on:
  push:
    branches:
      - hotfix/client-phone-production

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact phone validation fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('apps/web/src/pages/ClientOnboardingV3.tsx')
          s = p.read_text()
          pattern = r'/\^.*?\$/\.test\(form\.phone\.trim\(\)\)'
          replacement = r'/^\+?[0-9][0-9 ()-]{6,}$/.test(form.phone.trim())'
          matches = list(re.finditer(pattern, s))
          if len(matches) != 2:
              raise SystemExit(f'Expected exactly 2 phone validation expressions, found {len(matches)}')
          p.write_text(re.sub(pattern, replacement, s))
          print('Applied exact fix to both phone validation expressions.')
          PY

      - name: Verify exact source state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('apps/web/src/pages/ClientOnboardingV3.tsx').read_text()
          expected = r'/^\+?[0-9][0-9 ()-]{6,}$/.test(form.phone.trim())'
          if s.count(expected) != 2:
              raise SystemExit(f'Expected exactly 2 corrected expressions, found {s.count(expected)}')
          print('Source verification passed.')
          PY
          git diff --check

      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/pages/ClientOnboardingV3.tsx
          git diff --cached --check
          git commit -m 'fix: unblock valid client phone numbers during onboarding'
          git push origin HEAD:hotfix/client-phone-production

      - name: Remove one-shot workflow
        if: always()
        run: |
          git rm -f .github/workflows/one-shot-client-phone-production.yml || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove one-shot client phone workflow'
            git push origin HEAD:hotfix/client-phone-production
          fi
