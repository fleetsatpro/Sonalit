name: Restore app and wire Collection Fabric

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, 'restore app.js from pre-collection baseline') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore app.js from known-good baseline
        run: |
          git checkout aed13b54a7b4705126311322e95f66d6f2d3169a -- backend/src/app.js

      - name: Wire Collection Fabric scheduler
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/src/app.js')
          s = p.read_text()
          block = r'''

          // Intelligence Collection Fabric: durable, source-aware ingestion into intel_observations.
          // Adapters are independently optional and activate only when configured credentials/sources exist.
          // Failures are isolated per provider so one upstream cannot stop the intelligence pipeline.
          if (!process.env.GENERATE_OPENAPI && process.env.NODE_ENV !== 'test')
          try {
            const cron = require("node-cron");
            const { runCollectionFabric } = require("./utils/collectionFabric");
            cron.schedule("*/30 * * * *", () => runCollectionFabric().catch(err => logger.error("Intelligence Collection Fabric error: " + err.message)));
            runCollectionFabric().catch(err => logger.warn("Intelligence Collection Fabric startup run: " + err.message));
            logger.info("Intelligence Collection Fabric scheduled (every 30 minutes)");
          } catch (e) { logger.warn("Intelligence Collection Fabric not scheduled: " + e.message); }
          '''
          marker = '// BL-010:'
          if 'runCollectionFabric' not in s:
              if marker in s:
                  s = s.replace(marker, block + '\n' + marker, 1)
              else:
                  marker2 = '// ─── Start server'
                  if marker2 in s:
                      s = s.replace(marker2, block + '\n' + marker2, 1)
                  else:
                      raise SystemExit('No safe insertion marker found in restored app.js')
          p.write_text(s)
          PY

      - name: Remove one-shot recovery workflow and commit
        run: |
          rm -f .github/workflows/restore-app-and-wire-collection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/app.js .github/workflows/restore-app-and-wire-collection.yml
          git commit -m "restore app.js from pre-collection baseline and wire Collection Fabric"
          git push
