name: One-shot phone validation fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'one-shot phone validation fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch onboarding validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/ClientOnboardingV3.tsx')
          s = p.read_text()
          old_import = "import { api } from '../lib/api.js';\n"
          new_import = old_import + "import { isValidPhone, normalizePhone } from '../lib/phone.js';\n"
          if "../lib/phone.js" not in s:
              s = s.replace(old_import, new_import, 1)
          start = s.index('function isValidPhoneInput(')
          end = s.index('\n\nexport default function ClientOnboardingV3()', start)
          s = s[:start] + "const isValidPhoneInput = isValidPhone;\nconst normalizeClientPhone = normalizePhone;" + s[end:]
          s = s.replace("if (!isValidPhoneInput(form.phone, form.country)) throw new Error('Enter a valid primary contact phone number.');", "const normalizedPhone = normalizeClientPhone(form.phone, form.country);\n      if (!normalizedPhone) throw new Error('Enter a valid primary contact phone number.');")
          s = s.replace("phone: form.phone.trim(), country: form.country", "phone: normalizedPhone, country: form.country")
          s = s.replace("phone: form.phone.trim(),\n            email", "phone: normalizedPhone,\n            email")
          s = s.replace("phone: form.phone.trim(), enabled: true", "phone: normalizedPhone, enabled: true")
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          grep -q "../lib/phone.js" apps/web/src/pages/ClientOnboardingV3.tsx
          grep -q "normalizeClientPhone" apps/web/src/pages/ClientOnboardingV3.tsx
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/ClientOnboardingV3.tsx .github/workflows/one-shot-phone-fix.yml
          git rm .github/workflows/one-shot-phone-fix.yml
          git commit -m "fix: one-shot phone validation fix"
          git push
