name: Build Sonalit Field APK

# Sonalit Field is the Yard/Port team's Capacitor shell (apps/sonalit-field).
# Like the operator app, it loads the hosted web app, so /field UI changes ship
# via the web deploy — this workflow only rebuilds when the shell itself
# changes (or on manual dispatch).
on:
  push:
    branches: [main]
    paths:
      - 'apps/sonalit-field/**'
      - '.github/workflows/build-sonalit-field-apk.yml'
  pull_request:
    paths:
      - 'apps/sonalit-field/**'
      - '.github/workflows/build-sonalit-field-apk.yml'
  workflow_dispatch:

concurrency:
  group: sonalit-field-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: apps/sonalit-field
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        working-directory: apps/sonalit-field
        run: npx cap add android

      # Field-team branding: orange background matches the Yard accent used in
      # the /field UI so the launcher icon reads as distinct from the general
      # Sonalit operator app on the same device.
      - name: Generate launcher icon + splash
        working-directory: apps/sonalit-field
        run: >
          npx @capacitor/assets generate --android
          --iconBackgroundColor '#ff7a00' --iconBackgroundColorDark '#ff7a00'
          --splashBackgroundColor '#0B111C' --splashBackgroundColorDark '#0B111C'

      - name: Sync web shell into Android
        working-directory: apps/sonalit-field
        run: npx cap sync android

      - name: Stamp APK version
        working-directory: apps/sonalit-field/android/app
        run: |
          # `cap add android` regenerates this project on every run, so the
          # template's `versionCode 1` would ship on every release. Identical
          # codes mean Android sees no version difference: an OLDER build can be
          # installed over a newer one with no downgrade warning, and nothing
          # on-device identifies which build a driver is actually running.
          # Both matter for a tracking app — a stale APK silently reintroducing
          # a telemetry bug is exactly the failure that must not be invisible.
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          grep -nE "versionCode|versionName" build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default is "tools platform-tools". The obsolete "tools" package drags
          # in the ~300MB Android Emulator, whose download intermittently arrives
          # corrupt ("Error on ZipFile unknown archive") and fails the whole job.
          # Nothing here emulates anything — the next step installs the build-tools
          # and platform this build actually needs.
          packages: 'platform-tools'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install platform and build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-35"

      - name: Set local.properties
        working-directory: apps/sonalit-field/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -f variables.gradle ]; then
            sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' variables.gradle
          fi

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > apps/sonalit-field/android/app/release.keystore

      - name: Inject release signing config
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        working-directory: apps/sonalit-field/android/app
        run: |
          sed -i '/android {/a\
              signingConfigs {\
                  release {\
                      storeFile file("release.keystore")\
                      storePassword System.getenv("KEYSTORE_PASSWORD")\
                      keyAlias System.getenv("KEY_ALIAS")\
                      keyPassword System.getenv("KEY_PASSWORD")\
                  }\
              }' build.gradle
          # Capacitor's generated release buildType doesn't reliably reference
          # signingConfigs.debug, so a text-replace sed can silently no-op and
          # leave the release build unsigned. Assign it via the Gradle DSL
          # instead — this works regardless of what's inside buildTypes.release.
          echo 'android.buildTypes.release.signingConfig = android.signingConfigs.release' >> build.gradle

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-sonalit-field-gradle-${{ hashFiles('apps/sonalit-field/android/**/*.gradle*', 'apps/sonalit-field/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-sonalit-field-gradle-

      - name: Make gradlew executable
        run: chmod +x apps/sonalit-field/android/gradlew

      - name: Build APK
        working-directory: apps/sonalit-field/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f app/release.keystore ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate and rename APK
        run: |
          APK_DIR=apps/sonalit-field/android/app/build/outputs/apk
          if [ -f "$APK_DIR/release/app-release.apk" ]; then
            mv "$APK_DIR/release/app-release.apk" "$APK_DIR/sonalit-field.apk"
          elif [ -f "$APK_DIR/release/app-release-unsigned.apk" ]; then
            echo "::error::Release APK is unsigned — signingConfig was not applied to buildTypes.release. Check the 'Inject release signing config' step."
            mv "$APK_DIR/release/app-release-unsigned.apk" "$APK_DIR/sonalit-field.apk"
          elif [ -f "$APK_DIR/debug/app-debug.apk" ]; then
            mv "$APK_DIR/debug/app-debug.apk" "$APK_DIR/sonalit-field.apk"
          else
            echo "::error::No APK found under $APK_DIR"
            find "$APK_DIR" -name '*.apk' || true
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SonalitField
          path: apps/sonalit-field/android/app/build/outputs/apk/sonalit-field.apk
          retention-days: 7

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sonalit-field-v${{ github.run_number }}
          name: Sonalit Field v${{ github.run_number }}
          body: |
            Sonalit Field APK — Yard & Port teams — auto-built from commit ${{ github.sha }}.

            **Install**: Download and open on an Android 7.0+ device (enable "Install unknown apps" in settings). Installing a newer build over an older one is an in-place update — no uninstall needed.

            **What it does**:
              • **Yard team**: pick a booking → pick a container → clamp e-lock, enter transporter / truck / trailer / driver — auto-syncs to the CDS control room.
              • **Port team**: see live in-transit containers on a map, tap to unclamp on arrival — notifies supervisors that the container has been delivered.

            **Sign in** with your regular Sonalit credentials. Each clamp/unclamp is attributed to the signed-in user in the CDS audit log.

            **Updates**: This app loads the live /field surface, so UI and workflow changes appear automatically on next open. You only need a new APK for rare native changes (new Capacitor plugins, permissions).
          files: apps/sonalit-field/android/app/build/outputs/apk/sonalit-field.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
