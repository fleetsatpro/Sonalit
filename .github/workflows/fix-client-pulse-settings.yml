name: One-time CDS Client Pulse Settings Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-production-settings:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch the production CDS SettingsView
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/web/src/pages/cds/pages.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''export function SettingsView() {
            const [tab, setTab] = useState('profile');
            const tabs = ['profile', 'field access'];

            return (
              <div className="p-5 max-w-[1600px] mx-auto">
                <div className="flex gap-4" style={{ minHeight: 400 }}>
                  <div className="w-[180px] flex-none space-y-1">
                    {tabs.map(t => (
                      <button key={t} onClick={() => setTab(t)}
                        className={`w-full text-left px-4 py-2.5 rounded-lg text-xs font-semibold border-none cursor-pointer transition-colors capitalize ${tab === t ? 'bg-[rgba(255,255,255,.06)] text-cds-orange' : 'bg-transparent text-text-2 hover:text-text-1'}`}>
                        {t}
                      </button>
                    ))}
                  </div>
                  {tab === 'field access' ? (
                    <FieldAccessPanel />
                  ) : (
                    <ProfilePanel />
                  )}
                </div>
              </div>
            );
          }
'''

          new = '''export function SettingsView() {
            const [tab, setTab] = useState('profile');
            const tabs = ['profile', 'field access', 'client pulse'];

            return (
              <div className="p-5 max-w-[1600px] mx-auto">
                <div className="flex gap-4" style={{ minHeight: 400 }}>
                  <div className="w-[180px] flex-none space-y-1">
                    {tabs.map(t => (
                      <button key={t} onClick={() => setTab(t)}
                        className={`w-full text-left px-4 py-2.5 rounded-lg text-xs font-semibold border-none cursor-pointer transition-colors capitalize ${tab === t ? 'bg-[rgba(255,255,255,.06)] text-cds-orange' : 'bg-transparent text-text-2 hover:text-text-1'}`}>
                        {t}
                      </button>
                    ))}
                  </div>
                  {tab === 'field access' ? (
                    <FieldAccessPanel />
                  ) : tab === 'client pulse' ? (
                    <ClientPulseSettings />
                  ) : (
                    <ProfilePanel />
                  )}
                </div>
              </div>
            );
          }

          function ClientPulseSettings() {
            const [recipients, setRecipients] = useState('');
            const [message, setMessage] = useState('');
            const [busy, setBusy] = useState(false);
            const { addToast } = useCDSStore();

            const send = async () => {
              const list = recipients.split(/[\\n,;]+/).map(v => v.trim()).filter(Boolean);
              const invalid = list.find(v => !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(v));
              if (!list.length) { addToast('Add at least one client email', 'error'); return; }
              if (invalid) { addToast(`Invalid email: ${invalid}`, 'error'); return; }
              setBusy(true);
              try {
                const res = await fetch('/api/v1/settings/cds-client-pulse/send', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ recipients: list, message: message.trim() || undefined }),
                });
                if (!res.ok) throw new Error(await res.text());
                setMessage('');
                addToast(`Client Pulse sent to ${list.length} recipient${list.length === 1 ? '' : 's'}`);
              } catch (err) {
                addToast(err instanceof Error ? err.message.slice(0, 120) : 'Client Pulse send failed', 'error');
              } finally {
                setBusy(false);
              }
            };

            return (
              <Card className="flex-1 p-5">
                <div className="flex items-start justify-between gap-4 mb-5">
                  <div>
                    <div className="text-sm font-bold text-text-0">Client Pulse</div>
                    <p className="text-[11px] text-text-2 mt-1 max-w-2xl">Manage operational recipients and manually trigger the client-facing pulse. Recipients are separate from Sonalit login accounts.</p>
                  </div>
                  <Badge variant="ok">LIVE ROUTING</Badge>
                </div>
                <div className="space-y-4">
                  <div>
                    <label className="block text-[10px] font-mono uppercase tracking-widest text-text-2 mb-1.5">Client email recipients</label>
                    <textarea value={recipients} onChange={e => setRecipients(e.target.value)} rows={5} placeholder="client@example.com\\noperations@example.com" className="w-full rounded-lg bg-white/[.04] border border-white/[.08] text-text-0 text-[13px] p-3 outline-none focus:border-cds-orange/50 resize-y" />
                    <p className="text-[10px] text-text-2 mt-1">One per line, or separate addresses with commas/semicolons.</p>
                  </div>
                  <div>
                    <label className="block text-[10px] font-mono uppercase tracking-widest text-text-2 mb-1.5">Optional message</label>
                    <textarea value={message} onChange={e => setMessage(e.target.value)} rows={4} placeholder="Leave blank to use the generated Client Pulse." className="w-full rounded-lg bg-white/[.04] border border-white/[.08] text-text-0 text-[13px] p-3 outline-none focus:border-cds-orange/50 resize-y" />
                  </div>
                  <div className="flex justify-end">
                    <Button size="sm" disabled={busy} onClick={() => void send()}>{busy ? 'Sending…' : 'Send Client Pulse Now'}</Button>
                  </div>
                </div>
              </Card>
            );
          }
'''

          if old not in text:
              raise SystemExit('Expected production SettingsView was not found; refusing to modify the file.')
          if 'function ClientPulseSettings()' in text or "'client pulse'" in text:
              raise SystemExit('Client Pulse Settings already exists; refusing to make a duplicate change.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit production Settings fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/cds/pages.tsx
          git diff --cached --quiet && { echo "No change needed"; exit 0; }
          git commit -m "fix(cds): expose Client Pulse in production Settings"
          git push origin HEAD:main

      - name: Remove one-time workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-client-pulse-settings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/fix-client-pulse-settings.yml
          git diff --cached --quiet || git commit -m "chore: remove one-time CDS settings fixer"
          git push origin HEAD:main || true
