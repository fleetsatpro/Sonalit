name: Repair Intelligence Orbit Channel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'chore: repair Intelligence Centre Orbit channel config'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Intelligence Centre Orbit channel configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/Orbit.tsx')
          s = p.read_text()
          needle = "  'Container Management':  { color: '#ff7a00', bgType: 'container', vizType: 'fillLevel', statusLabel: 'Tracking',    statusColor: '#2dd4a8', statusGlow: 'rgba(45,212,168,.5)' },\n"
          addition = needle + "  'Intelligence Centre':    { color: '#7c8cff', bgType: 'radar',     vizType: 'waveform',      statusLabel: 'Intelligence', statusColor: '#2dd4a8', statusGlow: 'rgba(45,212,168,.5)' },\n"
          if "  'Intelligence Centre':    { color: '#7c8cff'" in s:
              print('Already repaired')
          elif needle not in s:
              raise SystemExit('Expected CHANNEL_CFG anchor not found; refusing unsafe edit')
          else:
              p.write_text(s.replace(needle, addition, 1))
              print('Intelligence Centre CHANNEL_CFG entry added')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/Orbit.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(intelligence): configure Orbit intelligence channel"
            git push
          fi
