name: Temporary tenant branch sync

on:
  push:
    branches:
      - security/tenant-isolation-hardening

permissions:
  contents: write

jobs:
  sync-main:
    if: "!contains(github.event.head_commit.message, '[tenant-sync]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: security/tenant-isolation-hardening
      - name: Merge main into tenant branch with security branch precedence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff -X ours origin/main -m "chore(security): sync tenant hardening with main [tenant-sync]"
          git rm .github/workflows/_tenant_sync.yml
          git commit --amend --no-edit
          git push origin HEAD:security/tenant-isolation-hardening
