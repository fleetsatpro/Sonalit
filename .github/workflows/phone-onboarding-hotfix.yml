name: Client onboarding phone hotfix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  hotfix:
    if: ${{ !contains(github.event.head_commit.message, 'chore: remove one-shot phone onboarding hotfix') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch malformed phone validators
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/ClientOnboardingV3.tsx')
          lines = p.read_text().splitlines(keepends=True)
          targets = [
              "if (!form.phone.trim()) throw new Error('Primary contact phone is required.');",
              "const phoneValid =",
          ]
          replacements = [
              "      if (!form.phone.trim()) throw new Error('Primary contact phone is required.');\n",
              "  const phoneValid = /^\\+?[0-9][0-9 ()-]{6,}$/.test(form.phone.trim());\n",
          ]
          found = [False, False]
          out = []
          for line in lines:
              if line.startswith('      if (!/^') and '.test(form.phone.trim())' in line:
                  out.append("      if (!/^\\+?[0-9][0-9 ()-]{6,}$/.test(form.phone.trim())) throw new Error('Enter a valid primary contact phone number.');\n")
                  found[0] = True
              elif line.startswith('  const phoneValid ='):
                  out.append(replacements[1])
                  found[1] = True
              else:
                  out.append(line)
          if not all(found):
              raise SystemExit(f'Could not locate both phone validators: {found}')
          p.write_text(''.join(out))
          print('Patched both ClientOnboardingV3 phone validators.')
          PY

      - name: Verify
        shell: bash
        run: |
          grep -Fq "if (!/^\\+?[0-9][0-9 ()-]{6,}$/.test(form.phone.trim()))" apps/web/src/pages/ClientOnboardingV3.tsx
          grep -Fq "const phoneValid = /^\\+?[0-9][0-9 ()-]{6,}$/.test(form.phone.trim());" apps/web/src/pages/ClientOnboardingV3.tsx
          git diff --check
          echo 'Client phone validation hotfix verified.'

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/pages/ClientOnboardingV3.tsx
          git diff --cached --check
          git commit -m 'fix: accept valid client phone numbers during onboarding'
          git push origin HEAD:main

      - name: Remove one-shot workflow
        if: ${{ success() }}
        run: |
          git rm .github/workflows/phone-onboarding-hotfix.yml
          git commit -m 'chore: remove one-shot phone onboarding hotfix'
          git push origin HEAD:main
