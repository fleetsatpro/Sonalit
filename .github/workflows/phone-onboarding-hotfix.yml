name: Client onboarding phone hotfix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  hotfix:
    if: ${{ !contains(github.event.head_commit.message, 'chore: remove one-shot phone onboarding hotfix') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch malformed phone validators
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/ClientOnboardingV3.tsx')
          s = p.read_text()
          bad = r'/^\\+?[0-9][0-9 ()-]{6,}$/'
          good = r'/^\+?[0-9][0-9 ()-]{6,}$/'
          count = s.count(bad)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 malformed phone validators, found {count}')
          p.write_text(s.replace(bad, good))
          print(f'Corrected {count} validators')
          PY

      - name: Verify
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('apps/web/src/pages/ClientOnboardingV3.tsx').read_text()
          bad = r'/^\\+?[0-9][0-9 ()-]{6,}$/'
          good = r'/^\+?[0-9][0-9 ()-]{6,}$/'
          if bad in s:
              raise SystemExit('Malformed validator remains')
          if s.count(good) != 2:
              raise SystemExit(f'Expected 2 corrected validators, found {s.count(good)}')
          print('Phone validation hotfix verified.')
          PY
          git diff --check

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/pages/ClientOnboardingV3.tsx
          git diff --cached --check
          git commit -m 'fix: accept valid client phone numbers during onboarding'
          git push origin HEAD:main

      - name: Remove one-shot workflow
        if: ${{ success() }}
        run: |
          git rm .github/workflows/phone-onboarding-hotfix.yml
          git commit -m 'chore: remove one-shot phone onboarding hotfix'
          git push origin HEAD:main
