name: Client onboarding phone validation hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, 'chore: remove phone validation hardening workflow') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Harden phone normalization and validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('apps/web/src/pages/ClientOnboardingV3.tsx')
          s = p.read_text()
          start = s.index('function isValidPhoneInput(')
          end = s.index('\n\nexport default function ClientOnboardingV3()', start)
          replacement = r'''function normalizePhoneInput(input: string, country = 'Kenya') {
            const raw = String(input ?? '').trim();
            if (!raw) return '';
            const compact = raw.replace(/[()\s-]/g, '');
            if (country.trim().toLowerCase() === 'kenya') {
              if (/^0\d{9}$/.test(compact)) return `+254${compact.slice(1)}`;
              if (/^254\d{9}$/.test(compact)) return `+${compact}`;
              if (/^\+254\d{9}$/.test(compact)) return compact;
            }
            return compact;
          }

          function isValidPhoneInput(input: string, country = 'Kenya') {
            const normalized = normalizePhoneInput(input, country);
            if (!normalized || !/^\+[1-9]\d{7,14}$/.test(normalized)) return false;
            if (country.trim().toLowerCase() === 'kenya') return /^\+254(?:[17]\d{8})$/.test(normalized);
            return true;
          }'''
          s = s[:start] + replacement + s[end:]
          s = s.replace('phone: form.phone.trim(), country: form.country', 'phone: normalizePhoneInput(form.phone, form.country), country: form.country')
          s = s.replace('phone: form.phone.trim(), enabled: true', 'phone: normalizePhoneInput(form.phone, form.country), enabled: true')
          p.write_text(s)
          PY

      - name: Verify source
        run: |
          grep -Fq 'function normalizePhoneInput' apps/web/src/pages/ClientOnboardingV3.tsx
          grep -Fq 'function isValidPhoneInput' apps/web/src/pages/ClientOnboardingV3.tsx
          grep -Fq 'normalizePhoneInput(form.phone, form.country)' apps/web/src/pages/ClientOnboardingV3.tsx
          git diff --check

      - name: Build web application
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/pages/ClientOnboardingV3.tsx
          git diff --cached --check
          git commit -m 'fix: harden client phone normalization and validation'
          git push origin HEAD:main

      - name: Remove one-shot workflow
        if: ${{ success() }}
        run: |
          git rm .github/workflows/phone-onboarding-hotfix.yml
          git commit -m 'chore: remove phone validation hardening workflow'
          git push origin HEAD:main
