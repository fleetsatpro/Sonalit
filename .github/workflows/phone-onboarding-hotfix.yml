name: Client onboarding phone validation hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, 'chore: remove phone validation hardening workflow') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove unsupported phone field from communication recipient payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/ClientOnboardingV3.tsx')
          s = p.read_text()
          old = "const r = await api.post('/communications/recipients', { email: primary.email.trim().toLowerCase(), name: primary.name.trim() || form.name.trim(), company: form.company.trim(), phone: normalizedPhone, enabled: true });"
          new = "const r = await api.post('/communications/recipients', { email: primary.email.trim().toLowerCase(), name: primary.name.trim() || form.name.trim(), company: form.company.trim(), enabled: true });"
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one communications recipient payload to patch, found {count}')
          p.write_text(s.replace(old, new))
          PY

      - name: Verify source and build
        working-directory: apps/web
        run: |
          grep -Fq "api.post('/communications/recipients', { email: primary.email.trim().toLowerCase(), name: primary.name.trim() || form.name.trim(), company: form.company.trim(), enabled: true })" src/pages/ClientOnboardingV3.tsx
          if grep -Fq "api.post('/communications/recipients', { email: primary.email.trim().toLowerCase(), name: primary.name.trim() || form.name.trim(), company: form.company.trim(), phone: normalizedPhone" src/pages/ClientOnboardingV3.tsx; then
            echo 'Unsupported phone field is still present in communications recipient payload' >&2
            exit 1
          fi
          npm install --no-audit --no-fund
          npm run build
          git diff --check

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/pages/ClientOnboardingV3.tsx
          git diff --cached --check
          git commit -m 'fix: stop sending unsupported phone field to communication recipients'
          git push origin HEAD:main

      - name: Remove one-shot workflow
        if: ${{ success() }}
        run: |
          git rm .github/workflows/phone-onboarding-hotfix.yml
          git commit -m 'chore: remove phone validation hardening workflow'
          git push origin HEAD:main
