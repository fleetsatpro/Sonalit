name: Apply client phone normalization hardening

on:
  push:
    branches:
      - fix/client-phone-normalization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/client-phone-normalization
          fetch-depth: 0

      - name: Apply canonical phone validation and normalization
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Backend canonicalizer: deliberately dependency-free and shared by every
          # authoritative write path touched by this onboarding flow.
          backend = Path('backend/src/utils/phone.js')
          backend.parent.mkdir(parents=True, exist_ok=True)
          backend.write_text(r'''\
          'use strict';

          const COUNTRY_DIAL_CODES = Object.freeze({
            Kenya: '254', Uganda: '256', Tanzania: '255', Rwanda: '250',
            'Democratic Republic of the Congo': '243', DRC: '243',
            'South Africa': '27', Nigeria: '234', Ghana: '233', Ethiopia: '251',
            'United Kingdom': '44', 'United States': '1', Canada: '1',
          });

          function digitsOnly(value) {
            return String(value ?? '').replace(/[\\s().-]/g, '');
          }

          function normalizePhone(value, country = 'Kenya') {
            const raw = String(value ?? '').trim();
            if (!raw || /[A-Za-z]/.test(raw)) return null;
            const cleaned = digitsOnly(raw);
            if (!cleaned || cleaned === '+' || !/^\\+?\\d+$/.test(cleaned)) return null;

            const dial = COUNTRY_DIAL_CODES[country] || null;
            let e164;
            if (cleaned.startsWith('+')) {
              e164 = cleaned;
            } else if (dial && cleaned.startsWith('0')) {
              const national = cleaned.slice(1);
              e164 = `+${dial}${national}`;
            } else if (dial && cleaned.startsWith(dial)) {
              e164 = `+${cleaned}`;
            } else {
              return null;
            }

            const digits = e164.slice(1);
            if (!/^[1-9]\\d{7,14}$/.test(digits)) return null;
            if (dial && e164.startsWith(`+${dial}`) && cleaned.startsWith('0') && cleaned.length < 8) return null;
            return e164;
          }

          function validatePhone(value, country = 'Kenya') {
            return normalizePhone(value, country) !== null;
          }

          module.exports = { COUNTRY_DIAL_CODES, normalizePhone, validatePhone };
          ''', encoding='utf-8')

          # Frontend canonicalizer. Kept API-compatible with the backend and
          # intentionally independent so the UI can validate before activation.
          frontend = Path('apps/web/src/lib/phone.js')
          frontend.parent.mkdir(parents=True, exist_ok=True)
          frontend.write_text(r'''\
          export const COUNTRY_DIAL_CODES = Object.freeze({
            Kenya: '254', Uganda: '256', Tanzania: '255', Rwanda: '250',
            'Democratic Republic of the Congo': '243', DRC: '243',
            'South Africa': '27', Nigeria: '234', Ghana: '233', Ethiopia: '251',
            'United Kingdom': '44', 'United States': '1', Canada: '1',
          });

          const digitsOnly = value => String(value ?? '').replace(/[\\s().-]/g, '');

          export function normalizePhone(value, country = 'Kenya') {
            const raw = String(value ?? '').trim();
            if (!raw || /[A-Za-z]/.test(raw)) return null;
            const cleaned = digitsOnly(raw);
            if (!cleaned || cleaned === '+' || !/^\\+?\\d+$/.test(cleaned)) return null;
            const dial = COUNTRY_DIAL_CODES[country] || null;
            let e164;
            if (cleaned.startsWith('+')) e164 = cleaned;
            else if (dial && cleaned.startsWith('0')) e164 = `+${dial}${cleaned.slice(1)}`;
            else if (dial && cleaned.startsWith(dial)) e164 = `+${cleaned}`;
            else return null;
            const digits = e164.slice(1);
            if (!/^[1-9]\\d{7,14}$/.test(digits)) return null;
            return e164;
          }

          export const validatePhone = (value, country = 'Kenya') => normalizePhone(value, country) !== null;
          ''', encoding='utf-8')

          # Harden the Client Intelligence screen: one canonical validator for
          # Continue eligibility and activation, and one normalized value for all
          # downstream identities.
          p = Path('apps/web/src/pages/ClientOnboardingV3.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace("import { useAuthStore } from '../stores/auth.js';", "import { useAuthStore } from '../stores/auth.js';\nimport { normalizePhone, validatePhone, COUNTRY_DIAL_CODES } from '../lib/phone.js';")
          s = s.replace("if (!/^\\\\+?[0-9][0-9 ()-]{6,}$/.test(form.phone.trim())) throw new Error('Enter a valid primary contact phone number.');", "const phone = normalizePhone(form.phone, form.country);\n      if (!phone) throw new Error('Enter a valid primary contact phone number for the selected country.');")
          s = s.replace("phone: form.phone.trim()", "phone")
          s = s.replace("const phoneValid = /^\\\\+?[0-9][0-9 ()-]{6,}$/.test(form.phone.trim());", "const phoneValid = validatePhone(form.phone, form.country);")
          s = s.replace("<Field label=\"Country\" value={form.country} onChange={v => formPatch({ country: v })} placeholder=\"Kenya\"/>", "<CountryField value={form.country} onChange={v => formPatch({ country: v })}/>")
          if 'function CountryField' not in s:
              s += r'''

function CountryField({ value, onChange }: { value: string; onChange: (value: string) => void }) {
  return <label className="block"><span className="mb-1.5 block text-[10px] font-mono uppercase tracking-[.16em] text-slate-500">Country</span><select value={value} onChange={e => onChange(e.target.value)} className="w-full rounded-xl border border-white/[.08] bg-slate-900 px-3 py-2.5 text-xs text-slate-100 outline-none focus:border-orange-400/40">{Object.keys(COUNTRY_DIAL_CODES).map(country => <option key={country} value={country}>{country} (+{COUNTRY_DIAL_CODES[country as keyof typeof COUNTRY_DIAL_CODES]})</option>)}</select></label>;
}
'''
          p.write_text(s, encoding='utf-8')

          # Backend portal client endpoint is authoritative. Add phone storage and
          # reject/normalize invalid values before a client identity is created.
          p = Path('backend/src/routes/portalClients.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const { query } = require('../config/database');", "const { query } = require('../config/database');\nconst { normalizePhone } = require('../utils/phone');")
          old = "const { email, name, company } = req.body;\n  if (!email || !name) return res.status(400).json({ error: 'email and name required' });\n  const result = await req.db(\n    `INSERT INTO cargo_clients (org_id, email, name, company)\n     VALUES ($1, $2, $3, $4)\n     ON CONFLICT (org_id, email) DO UPDATE SET name = EXCLUDED.name, company = EXCLUDED.company\n     RETURNING id, org_id, email, name, company, created_at`,\n    [req.user.org_id, email.toLowerCase().trim(), name, company ?? null],\n  );"
          new = "const { email, name, company, phone, country = 'Kenya' } = req.body;\n  if (!email || !name) return res.status(400).json({ error: 'email and name required' });\n  const normalizedPhone = normalizePhone(phone, country);\n  if (!normalizedPhone) return res.status(400).json({ error: 'Enter a valid phone number for the selected country.' });\n  const result = await req.db(\n    `INSERT INTO cargo_clients (org_id, email, name, company, phone)\n     VALUES ($1, $2, $3, $4, $5)\n     ON CONFLICT (org_id, email) DO UPDATE SET name = EXCLUDED.name, company = EXCLUDED.company, phone = EXCLUDED.phone\n     RETURNING id, org_id, email, name, company, phone, created_at`,\n    [req.user.org_id, email.toLowerCase().trim(), name.trim(), company ?? null, normalizedPhone],\n  );"
          if old not in s: raise SystemExit('portalClients target block not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # CDS customer creation is also an authoritative write boundary.
          p = Path('backend/src/routes/cds.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const logger = require('../utils/logger');", "const logger = require('../utils/logger');\nconst { normalizePhone } = require('../utils/phone');")
          old = "router.post('/customers', asyncHandler(async (req, res) => {\n  await createRow(req, res, 'cds_customers',\n    ['company_name', 'contact_person', 'phone', 'email', 'address', 'city', 'country', 'status'],\n    { genField: 'code', genPrefix: 'CU' });\n}));"
          new = "router.post('/customers', asyncHandler(async (req, res) => {\n  const normalizedPhone = normalizePhone(req.body.phone, req.body.country || 'Kenya');\n  if (!normalizedPhone) return res.status(400).json({ error: 'Enter a valid phone number for the selected country.' });\n  req.body.phone = normalizedPhone;\n  await createRow(req, res, 'cds_customers',\n    ['company_name', 'contact_person', 'phone', 'email', 'address', 'city', 'country', 'status'],\n    { genField: 'code', genPrefix: 'CU' });\n}));"
          if old not in s: raise SystemExit('CDS customer target block not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # Persist the canonical client phone in the cargo-client identity table.
          migration = Path('backend/migrations/20260908_107_client_phone_normalization.sql')
          migration.write_text('''-- Canonical client phone identity for Client Intelligence onboarding.\nALTER TABLE cargo_clients ADD COLUMN IF NOT EXISTS phone TEXT;\nCREATE INDEX IF NOT EXISTS idx_cargo_clients_org_phone ON cargo_clients(org_id, phone) WHERE deleted_at IS NULL AND phone IS NOT NULL;\n''', encoding='utf-8')

          # Deterministic tests for the canonical rules.
          test = Path('backend/test/clientPhoneNormalization.test.js')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text(r'''const assert = require('assert');
          const { normalizePhone, validatePhone } = require('../src/utils/phone');
          const cases = [
            ['0712345678', 'Kenya', '+254712345678'],
            ['+254712345678', 'Kenya', '+254712345678'],
            ['+254 712 345 678', 'Kenya', '+254712345678'],
            ['+254-712-345-678', 'Kenya', '+254712345678'],
            ['+254 (712) 345-678', 'Kenya', '+254712345678'],
            ['+', 'Kenya', null], ['123', 'Kenya', null], ['abcdef', 'Kenya', null],
            ['0712345678', 'Uganda', null],
            ['0771234567', 'Uganda', '+256771234567'],
          ];
          for (const [input, country, expected] of cases) assert.strictEqual(normalizePhone(input, country), expected, `${country}: ${input}`);
          assert.strictEqual(validatePhone('+254 712 345 678', 'Kenya'), true);
          console.log('client phone normalization: PASS');
          ''', encoding='utf-8')
          PY

      - name: Verify phone normalization and source invariants
        run: |
          node backend/test/clientPhoneNormalization.test.js
          node --check backend/src/utils/phone.js
          node --check backend/src/routes/portalClients.js
          node --check backend/src/routes/cds.js
          grep -q "validatePhone(form.phone, form.country)" apps/web/src/pages/ClientOnboardingV3.tsx
          ! grep -q "\\\\+?\[0-9\]\[0-9 ()-\]{6,}" apps/web/src/pages/ClientOnboardingV3.tsx
          grep -q "normalizePhone(form.phone, form.country)" apps/web/src/pages/ClientOnboardingV3.tsx

      - name: Commit hardened fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Sonalit Phone Hardening Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-client-phone-normalization.yml
          git add apps/web/src/lib/phone.js apps/web/src/pages/ClientOnboardingV3.tsx backend/src/utils/phone.js backend/src/routes/portalClients.js backend/src/routes/cds.js backend/migrations/20260908_107_client_phone_normalization.sql backend/test/clientPhoneNormalization.test.js
          git commit -m "fix: harden Client Intelligence phone normalization"
          git push origin fix/client-phone-normalization
