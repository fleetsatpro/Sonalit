name: Build Guardian Agent APK

on:
  push:
    branches: [main, claude/enhance-navigation-features-0S2pp]
    paths:
      - 'guardian-agent/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('guardian-agent/**/*.gradle*', 'guardian-agent/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x guardian-agent/gradlew

      - name: Build debug APK
        working-directory: guardian-agent
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FleetOps-Guardian-debug
          path: guardian-agent/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release (on main push)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: guardian-agent-v${{ github.run_number }}
          name: Guardian Agent v${{ github.run_number }}
          body: |
            FleetOps Guardian Agent APK — auto-built from commit ${{ github.sha }}

            **Install**: Download and open on an Android device (enable "Install unknown apps" in settings).
            **Enroll**: Open the app, enter your server URL and org token from the Guardian page.
          files: guardian-agent/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
