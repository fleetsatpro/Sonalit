name: Build Guardian Agent APK
# Re-run to publish the APK to R2 now that the R2/RAILWAY credentials are wired.

on:
  push:
    branches: [main]
    paths:
      - 'apps/guardian-android/**'
      - '.github/workflows/build-guardian-apk.yml'
  # Compile the app on PRs that touch it so Kotlin errors are caught before
  # merge (the release + Railway steps below stay gated to main pushes, so a PR
  # run just builds + uploads the APK as an artifact — handy for on-device QA).
  pull_request:
    paths:
      - 'apps/guardian-android/**'
      - '.github/workflows/build-guardian-apk.yml'
  workflow_dispatch:
    inputs:
      upload_only:
        description: 'Upload artifact only — skip GitHub Release and Railway update'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# Cancel a superseded in-flight run when a PR is updated (main pushes keep their
# own lane so releases are never cancelled mid-flight).
concurrency:
  group: guardian-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default is "tools platform-tools". The obsolete "tools" package drags
          # in the ~300MB Android Emulator, whose download intermittently arrives
          # corrupt ("Error on ZipFile unknown archive") and fails the whole job.
          # Nothing here emulates anything — the next step installs the build-tools
          # and platform this build actually needs.
          packages: 'platform-tools'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install platform and build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-35"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/guardian-android/**/*.gradle*', 'apps/guardian-android/**/gradle-wrapper.properties', 'apps/guardian-android/**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Write google-services.json
        working-directory: apps/guardian-android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "Using production google-services.json from secret"
          else
            echo "Using placeholder google-services.json (FCM disabled)"
          fi

      - name: Generate Gradle wrapper
        working-directory: apps/guardian-android
        run: gradle wrapper --gradle-version=8.9 --distribution-type=bin

      - name: Make gradlew executable
        run: chmod +x apps/guardian-android/gradlew

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > apps/guardian-android/app/release.keystore

      - name: Build APK
        working-directory: apps/guardian-android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f app/release.keystore ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate APK
        id: apk
        run: |
          if [ -f apps/guardian-android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "path=apps/guardian-android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "name=SonalitGuardian-release" >> "$GITHUB_OUTPUT"
          else
            echo "path=apps/guardian-android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "name=SonalitGuardian-debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7

      # Publish the APK to Cloudflare R2 (the same storage that already holds
      # capture photos) so /download links to it directly — no GitHub release in
      # the download path. The R2 credentials are read straight from Railway
      # (where the backend already holds them) using RAILWAY_TOKEN, so there are
      # NO duplicate GitHub secrets to maintain. Skips cleanly if they can't be
      # resolved, in which case the Railway step below falls back to the release.
      - name: Publish APK to Cloudflare R2
        id: r2
        if: github.ref == 'refs/heads/main' && github.event.inputs.upload_only != 'true'
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # Most robust: R2 creds straight from GitHub secrets. If these are set
          # the Railway lookup below is skipped entirely.
          GH_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          GH_R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          GH_R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          GH_R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GH_R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          # Path 1 — R2 creds direct from GitHub secrets (preferred).
          R2_ACCOUNT_ID="$GH_R2_ACCOUNT_ID"; R2_ACCESS_KEY="$GH_R2_ACCESS_KEY"
          R2_SECRET_KEY="$GH_R2_SECRET_KEY"; R2_BUCKET="$GH_R2_BUCKET"; R2_PUBLIC_URL="$GH_R2_PUBLIC_URL"

          # Path 2 — fall back to reading them off Railway via RAILWAY_TOKEN.
          if [ -z "$R2_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_PUBLIC_URL" ]; then
            if [ -z "$RAILWAY_TOKEN" ]; then
              echo "::warning title=APK not published::No R2 creds — set R2_* GitHub secrets, or RAILWAY_TOKEN. get.sonalit.com can't serve the APK until one is present."
              exit 0
            fi
            echo "R2_* GitHub secrets not set — resolving R2 creds from Railway via RAILWAY_TOKEN."
            # Discover project / service / production-environment IDs.
            DISCOVER=$(curl -sf -X POST https://backboard.railway.com/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"query":"{ me { projects { edges { node { id name services { edges { node { id name } } } environments { edges { node { id name } } } } } } } }"}')
            PROJECT_ID=$(echo "$DISCOVER" | jq -r '.data.me.projects.edges[0].node.id')
            SERVICE_ID=$(echo "$DISCOVER" | jq -r '.data.me.projects.edges[0].node.services.edges[0].node.id')
            ENV_ID=$(echo "$DISCOVER" | jq -r '[.data.me.projects.edges[0].node.environments.edges[] | select(.node.name == "production")] | .[0].node.id')
            if [ "$ENV_ID" = "null" ] || [ -z "$ENV_ID" ]; then
              ENV_ID=$(echo "$DISCOVER" | jq -r '.data.me.projects.edges[0].node.environments.edges[0].node.id')
            fi
            if [ "$PROJECT_ID" = "null" ] || [ -z "$PROJECT_ID" ]; then
              echo "::warning title=APK not published::RAILWAY_TOKEN set but could not discover Railway project (bad/expired token?). Add R2_* GitHub secrets instead."
              exit 0
            fi
            # Read the service's resolved env vars (includes the R2_* set).
            PAYLOAD=$(jq -n --arg p "$PROJECT_ID" --arg e "$ENV_ID" --arg s "$SERVICE_ID" \
              '{query:"query($p:String!,$e:String!,$s:String!){ variables(projectId:$p, environmentId:$e, serviceId:$s) }", variables:{p:$p,e:$e,s:$s}}')
            VARS=$(curl -sf -X POST https://backboard.railway.com/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            R2_ACCOUNT_ID=$(echo "$VARS" | jq -r '.data.variables.R2_ACCOUNT_ID // empty')
            R2_ACCESS_KEY=$(echo "$VARS" | jq -r '.data.variables.R2_ACCESS_KEY // empty')
            R2_SECRET_KEY=$(echo "$VARS" | jq -r '.data.variables.R2_SECRET_KEY // empty')
            R2_BUCKET=$(echo "$VARS" | jq -r '.data.variables.R2_BUCKET // empty')
            R2_PUBLIC_URL=$(echo "$VARS" | jq -r '.data.variables.R2_PUBLIC_URL // empty')
          fi
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_PUBLIC_URL" ]; then
            echo "::warning title=APK not published::R2 creds unresolved (Railway vars sealed?). Add R2_ACCOUNT_ID/ACCESS_KEY/SECRET_KEY/BUCKET/PUBLIC_URL as GitHub secrets."
            exit 0
          fi
          echo "Resolved R2 creds — publishing APK."
          # Keep the fetched secrets out of the logs.
          echo "::add-mask::$R2_ACCOUNT_ID"; echo "::add-mask::$R2_ACCESS_KEY"; echo "::add-mask::$R2_SECRET_KEY"
          APK="${{ steps.apk.outputs.path }}"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_KEY"
          export AWS_DEFAULT_REGION=auto
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BASE="${R2_PUBLIC_URL%/}"
          # Stable "latest" object the download link always points at, plus a
          # versioned archive copy for history.
          aws s3 cp "$APK" "s3://${R2_BUCKET}/apk/sonalit-guardian.apk" \
            --endpoint-url "$ENDPOINT" \
            --content-type application/vnd.android.package-archive \
            --cache-control "public, max-age=60"
          aws s3 cp "$APK" "s3://${R2_BUCKET}/apk/sonalit-guardian-v${{ github.run_number }}.apk" \
            --endpoint-url "$ENDPOINT" \
            --content-type application/vnd.android.package-archive
          echo "apk_url=${BASE}/apk/sonalit-guardian.apk" >> "$GITHUB_OUTPUT"
          echo "Published APK → ${BASE}/apk/sonalit-guardian.apk"

      - name: Create Release (on main push)
        id: release
        if: github.ref == 'refs/heads/main' && github.event.inputs.upload_only != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: guardian-v${{ github.run_number }}
          name: Sonalit Guardian v${{ github.run_number }}
          body: |
            Sonalit Guardian APK — auto-built from commit ${{ github.sha }}

            **Install**: Download and open on an Android 10+ device (enable "Install unknown apps" in settings).
            **Enroll**: Open the app and enter your badge number (operator code) — device appears as Pending in the Guardian dashboard for approval.
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update APK_REDIRECT_URL on Railway
        if: github.ref == 'refs/heads/main' && github.event.inputs.upload_only != 'true'
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Prefer the R2-hosted copy (off GitHub); fall back to the release
          # asset if R2 wasn't configured/published this run.
          APK_URL="${{ steps.r2.outputs.apk_url }}"
          if [ -z "$APK_URL" ]; then
            APK_URL="https://github.com/fleetsatpro/Sonalit/releases/download/guardian-v${{ github.run_number }}/$(basename ${{ steps.apk.outputs.path }})"
          fi
          echo "Setting APK_REDIRECT_URL → $APK_URL"

          DISCOVER=$(curl -sf -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ me { projects { edges { node { id name services { edges { node { id name } } } environments { edges { node { id name } } } } } } } }"}')

          echo "Discovery response: $DISCOVER"

          PROJECT_ID=$(echo "$DISCOVER" | jq -r '.data.me.projects.edges[0].node.id')
          SERVICE_ID=$(echo "$DISCOVER" | jq -r '.data.me.projects.edges[0].node.services.edges[0].node.id')
          ENV_ID=$(echo "$DISCOVER" | jq -r '[.data.me.projects.edges[0].node.environments.edges[] | select(.node.name == "production")] | .[0].node.id')

          if [ "$ENV_ID" = "null" ] || [ -z "$ENV_ID" ]; then
            ENV_ID=$(echo "$DISCOVER" | jq -r '.data.me.projects.edges[0].node.environments.edges[0].node.id')
          fi

          if [ "$PROJECT_ID" = "null" ] || [ -z "$PROJECT_ID" ]; then
            echo "ERROR: Could not discover Railway IDs — check RAILWAY_TOKEN secret"
            exit 1
          fi

          cat > /tmp/gql.json <<EOF
          {
            "query": "mutation variableUpsert(\$input: VariableUpsertInput!) { variableUpsert(input: \$input) }",
            "variables": {
              "input": {
                "projectId": "$PROJECT_ID",
                "environmentId": "$ENV_ID",
                "serviceId": "$SERVICE_ID",
                "name": "APK_REDIRECT_URL",
                "value": "$APK_URL"
              }
            }
          }
          EOF

          RESPONSE=$(curl -sf -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/gql.json)

          echo "Upsert response: $RESPONSE"

          if echo "$RESPONSE" | grep -q '"errors"'; then
            echo "ERROR: Railway API returned errors"
            exit 1
          fi

          echo "APK_REDIRECT_URL updated successfully on Railway"
