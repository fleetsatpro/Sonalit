name: Build Guardian Agent APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_only:
        description: 'Upload artifact only — skip GitHub Release and Railway update'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ubuntu-latest has Android SDK, build-tools;34.0.0, platforms;android-34
      # and pre-accepted licenses at $ANDROID_HOME — no setup-android step needed.

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('guardian-agent/**/*.gradle*', 'guardian-agent/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: guardian-agent
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FleetOps-Guardian-debug
          path: guardian-agent/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release (on main push)
        id: release
        if: github.ref == 'refs/heads/main' && github.event.inputs.upload_only != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: guardian-agent-v${{ github.run_number }}
          name: Guardian Agent v${{ github.run_number }}
          body: |
            FleetOps Guardian Agent APK — auto-built from commit ${{ github.sha }}

            **Install**: Download and open on an Android device (enable "Install unknown apps" in settings).
            **Enroll**: Open the app, enter your server URL and org token from the Guardian page.
          files: guardian-agent/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update APK_REDIRECT_URL on Railway
        if: github.ref == 'refs/heads/main' && github.event.inputs.upload_only != 'true'
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          APK_URL="https://github.com/fleetsatpro/Sonalit/releases/download/guardian-agent-v${{ github.run_number }}/app-debug.apk"
          echo "Setting APK_REDIRECT_URL → $APK_URL"

          DISCOVER=$(curl -sf -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ me { projects { edges { node { id name services { edges { node { id name } } } environments { edges { node { id name } } } } } } } }"}')

          echo "Discovery response: $DISCOVER"

          PROJECT_ID=$(echo "$DISCOVER" | jq -r '.data.me.projects.edges[0].node.id')
          SERVICE_ID=$(echo "$DISCOVER" | jq -r '.data.me.projects.edges[0].node.services.edges[0].node.id')
          ENV_ID=$(echo "$DISCOVER" | jq -r '[.data.me.projects.edges[0].node.environments.edges[] | select(.node.name == "production")] | .[0].node.id')

          if [ "$ENV_ID" = "null" ] || [ -z "$ENV_ID" ]; then
            ENV_ID=$(echo "$DISCOVER" | jq -r '.data.me.projects.edges[0].node.environments.edges[0].node.id')
          fi

          echo "Project ID:     $PROJECT_ID"
          echo "Service ID:     $SERVICE_ID"
          echo "Environment ID: $ENV_ID"

          if [ "$PROJECT_ID" = "null" ] || [ -z "$PROJECT_ID" ]; then
            echo "ERROR: Could not discover Railway IDs — check RAILWAY_TOKEN secret"
            exit 1
          fi

          cat > /tmp/gql.json <<EOF
          {
            "query": "mutation variableUpsert(\$input: VariableUpsertInput!) { variableUpsert(input: \$input) }",
            "variables": {
              "input": {
                "projectId": "$PROJECT_ID",
                "environmentId": "$ENV_ID",
                "serviceId": "$SERVICE_ID",
                "name": "APK_REDIRECT_URL",
                "value": "$APK_URL"
              }
            }
          }
          EOF

          RESPONSE=$(curl -sf -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/gql.json)

          echo "Upsert response: $RESPONSE"

          if echo "$RESPONSE" | grep -q '"errors"'; then
            echo "ERROR: Railway API returned errors"
            exit 1
          fi

          echo "APK_REDIRECT_URL updated successfully on Railway"
