name: Client phone hotfix

on:
  push:
    branches:
      - fix/client-phone-normalization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch onboarding phone validation
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/web/src/pages/ClientOnboardingV3.tsx')
          s = p.read_text(encoding='utf-8')
          old = "const KEY = 'sonalit:client-intelligence:onboarding:v5';"
          new = """const KEY = 'sonalit:client-intelligence:onboarding:v5';

function normalizePhone(phone: string, country: string): string {
  const compact = phone.trim().replace(/[\\s()-]/g, '');
  if (country === 'Kenya') {
    if (/^07\\d{8}$/.test(compact)) return `+254${compact.slice(1)}`;
    if (/^\\+2547\\d{8}$/.test(compact)) return compact;
  }
  if (/^\\+\\d{8,15}$/.test(compact)) return compact;
  return '';
}

function isValidPhone(phone: string, country: string): boolean {
  return !!normalizePhone(phone, country);
}"""
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one insertion point, found {s.count(old)}')
          s = s.replace(old, new, 1)
          old1 = "if (!/^\\\\+?[0-9][0-9 ()-]{6,}$/.test(form.phone.trim())) throw new Error('Enter a valid primary contact phone number.');"
          new1 = "if (!isValidPhone(form.phone, form.country)) throw new Error('Enter a valid primary contact phone number.');"
          if s.count(old1) != 1:
              raise SystemExit(f'Expected one activation validator, found {s.count(old1)}')
          s = s.replace(old1, new1, 1)
          old2 = "phone: form.phone.trim() });"
          new2 = "phone: normalizePhone(form.phone, form.country) });"
          if s.count(old2) != 1:
              raise SystemExit(f'Expected one client phone payload, found {s.count(old2)}')
          s = s.replace(old2, new2, 1)
          old3 = "phone: form.phone.trim(),\n            email, country: form.country, status: 'active',"
          new3 = "phone: normalizePhone(form.phone, form.country),\n            email, country: form.country, status: 'active',"
          if s.count(old3) != 1:
              raise SystemExit(f'Expected one CDS phone payload, found {s.count(old3)}')
          s = s.replace(old3, new3, 1)
          old4 = "phone: form.phone.trim(), enabled: true"
          new4 = "phone: normalizePhone(form.phone, form.country), enabled: true"
          if s.count(old4) != 1:
              raise SystemExit(f'Expected one communications phone payload, found {s.count(old4)}')
          s = s.replace(old4, new4, 1)
          old5 = "const phoneValid = /^\\\\+?[0-9][0-9 ()-]{6,}$/.test(form.phone.trim());"
          new5 = "const phoneValid = isValidPhone(form.phone, form.country);"
          if s.count(old5) != 1:
              raise SystemExit(f'Expected one UI validator, found {s.count(old5)}')
          s = s.replace(old5, new5, 1)
          p.write_text(s, encoding='utf-8')
          print('Patched client onboarding phone validation and canonical payloads.')

      - name: Verify patch
        shell: bash
        run: |
          grep -n "function normalizePhone\|function isValidPhone\|phoneValid =\|Enter a valid primary contact phone" apps/web/src/pages/ClientOnboardingV3.tsx
          ! grep -n "^\\\\+?\[0-9\]" apps/web/src/pages/ClientOnboardingV3.tsx

      - name: Commit
        shell: bash
        run: |
          git config user.name 'Sonalit Hotfix Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/pages/ClientOnboardingV3.tsx
          git diff --cached --check
          git commit -m 'fix: accept and normalize valid client phone numbers'
          git push
