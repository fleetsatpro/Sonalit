name: Bootstrap Guardian Convoy lockfile

# One-time, branch-scoped lockfile repair for the Capacitor 8 migration.
# Runs only for the exact bootstrap commit; removes itself after the audited
# lockfile has been committed. No production secrets are used.
on:
  push:
    branches:
      - cds/container-custody-performance

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/guardian-convoy/package-lock.json

      - name: Generate matching lockfile
        working-directory: apps/guardian-convoy
        env:
          NODE_OPTIONS: ""
        run: npm install --package-lock-only --include=dev --ignore-scripts

      - name: Verify clean install, dependency security and web build
        working-directory: apps/guardian-convoy
        env:
          NODE_OPTIONS: ""
        run: |
          npm ci --include=dev
          npm audit --audit-level=moderate
          npm audit signatures
          npm run build

      - name: Commit lockfile and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/guardian-convoy/package-lock.json
          git rm .github/workflows/guardian-lock-bootstrap.yml
          git commit -m 'fix(security): lock Guardian Convoy Capacitor 8 dependencies'
          git push origin "HEAD:${GITHUB_REF}"
