name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @sonalit/contracts build

      - name: Typecheck web
        run: pnpm --filter @sonalit/web typecheck

      - name: Build web
        run: pnpm --filter @sonalit/web build

      - name: Backend unit tests
        run: pnpm --filter fleetops-backend test
        env:
          JWT_SECRET: ci-test-jwt-secret
          DATABASE_URL: ""

      - name: Dependency audit
        run: pnpm --filter fleetops-backend audit --audit-level=high
        continue-on-error: true
