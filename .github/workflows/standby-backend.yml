name: Standby Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Dockerfile.standby'
      - 'infra/standby/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'Dockerfile.standby'
      - 'infra/standby/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: standby-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # TEMP: build from PR head so the npm lock can be synchronized in-place.
          ref: ${{ github.head_ref || github.ref_name }} 
      # BEGIN TEMP NPM LOCK SYNC
      - name: Synchronize backend npm lockfile
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/ci-real-dependency-audit' }}
        env:
          BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          npm install --package-lock-only --omit=dev --ignore-scripts
          npm ci --omit=dev --ignore-scripts
          npm audit --omit=dev --audit-level=high
          cd ..

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('.github/workflows/standby-backend.yml')
          text = p.read_text()
          text = re.sub(r'\n      # BEGIN TEMP NPM LOCK SYNC.*?# END TEMP NPM LOCK SYNC\n', '\n', text, count=1, flags=re.S)
          text = text.replace(
              """  permissions:
            contents: write
            packages: write""",
              """  permissions:
            contents: read
            packages: write"""
          )
          text = text.replace(
              """      - name: Checkout
        uses: actions/checkout@v4
        with:
          # TEMP: build from PR head so the npm lock can be synchronized in-place.
          ref: ${{ github.head_ref || github.ref_name }}""",
              """      - name: Checkout
        uses: actions/checkout@v4"""
          )
          p.write_text(text)
          Path('.github/workflows/refresh-backend-npm-lock.yml').unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json .github/workflows/standby-backend.yml
          git add -u .github/workflows/refresh-backend-npm-lock.yml
          git commit -m "chore(standby): synchronize backend npm lockfile"
          git push origin "HEAD:${BRANCH}"
      # END TEMP NPM LOCK SYNC


      - name: Validate runtime fence JavaScript
        run: node --check backend/src/utils/runtimeFenceBootstrap.js

      - name: Validate failover shell scripts
        run: |
          bash -n infra/standby/promote.sh
          bash -n infra/standby/demote.sh
          bash -n infra/standby/setup-host.sh

      - name: Validate Compose configuration
        run: |
          cp infra/standby/.env.example infra/standby/.env
          docker compose -f infra/standby/docker-compose.yml -f infra/standby/docker-compose.active.yml config
          rm -f infra/standby/.env

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build standby image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.standby
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/fleetsatpro/sonalit-backend:standby
            ghcr.io/fleetsatpro/sonalit-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      STANDBY_SSH_HOST: ${{ secrets.STANDBY_SSH_HOST }}
      STANDBY_SSH_USER: ${{ secrets.STANDBY_SSH_USER }}
      STANDBY_SSH_KEY: ${{ secrets.STANDBY_SSH_KEY }}
      STANDBY_SSH_PORT: ${{ secrets.STANDBY_SSH_PORT }}
      STANDBY_GHCR_USER: ${{ secrets.STANDBY_GHCR_USER }}
      STANDBY_GHCR_TOKEN: ${{ secrets.STANDBY_GHCR_TOKEN }}
    steps:
      - name: Deploy standby container
        if: ${{ env.STANDBY_SSH_HOST != '' && env.STANDBY_SSH_USER != '' && env.STANDBY_SSH_KEY != '' && env.STANDBY_GHCR_USER != '' && env.STANDBY_GHCR_TOKEN != '' }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.STANDBY_SSH_HOST }}
          username: ${{ env.STANDBY_SSH_USER }}
          key: ${{ env.STANDBY_SSH_KEY }}
          port: ${{ env.STANDBY_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            cd /opt/sonalit-standby
            export SONALIT_IMAGE="ghcr.io/fleetsatpro/sonalit-backend:${{ github.sha }}"
            printf '%s\n' "GHCR image: ${SONALIT_IMAGE}"
            printf '%s' "$STANDBY_GHCR_TOKEN" | docker login ghcr.io -u "$STANDBY_GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -af --filter 'until=168h' || true
            curl --fail --silent --show-error --retry 12 --retry-delay 5 http://127.0.0.1:5000/health >/tmp/sonalit-standby-health.json
            cat /tmp/sonalit-standby-health.json
        env:
          STANDBY_GHCR_USER: ${{ env.STANDBY_GHCR_USER }}
          STANDBY_GHCR_TOKEN: ${{ env.STANDBY_GHCR_TOKEN }}

      - name: Skip standby deployment when credentials are not configured
        if: ${{ env.STANDBY_SSH_HOST == '' || env.STANDBY_SSH_USER == '' || env.STANDBY_SSH_KEY == '' || env.STANDBY_GHCR_USER == '' || env.STANDBY_GHCR_TOKEN == '' }}
        run: echo 'Standby deployment credentials are not configured; image build and validation still completed.'
