services:
  centrifugo:
    image: centrifugo/centrifugo:v5
    ports:
      - "8000:8000"
    environment:
      CENTRIFUGO_TOKEN_HMAC_SECRET: ${CENTRIFUGO_TOKEN_HMAC_SECRET:-dev-secret-change-in-prod}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev-api-key-change-in-prod}
      CENTRIFUGO_ADMIN: "false"
      CENTRIFUGO_LOG_LEVEL: debug
      CENTRIFUGO_ALLOW_SUBSCRIBE_FOR_CLIENT: "true"
    command: centrifugo --port=8000
    restart: unless-stopped

  postgres:
    # pgvector/pgvector ships the pgvector extension the RAG knowledge fabric
    # needs (services/ai-copilot-svc/src/rag). Same Postgres 16 underneath.
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sonalit
      POSTGRES_USER: sonalit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Local open-weight inference, so the AI plane is actually runnable in dev
  # rather than inert (see docs/ai/ARCHITECTURE_AUDIT.md §3).
  #
  # Ollama speaks the OpenAI-compatible protocol the `openai_compatible`
  # adapter targets, runs on CPU, and needs no GPU — which makes it the right
  # dev stand-in for the vLLM deployment production would use. Same adapter,
  # same registry row shape, so promoting from one to the other is a change
  # of endpoint.
  #
  # Pull an embedding model before first use:
  #   docker compose -f docker-compose.dev.yml exec ollama ollama pull bge-m3
  #
  # Then point the registry at it:
  #   UPDATE ai_models SET endpoint = 'http://localhost:11434/v1',
  #     status = 'production', approved_for_production = TRUE
  #    WHERE name = 'bge-m3';
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_models:
