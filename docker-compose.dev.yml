services:
  centrifugo:
    image: centrifugo/centrifugo:v5
    ports:
      - "8000:8000"
    environment:
      CENTRIFUGO_TOKEN_HMAC_SECRET: ${CENTRIFUGO_TOKEN_HMAC_SECRET:-dev-secret-change-in-prod}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev-api-key-change-in-prod}
      CENTRIFUGO_ADMIN: "false"
      CENTRIFUGO_LOG_LEVEL: debug
      CENTRIFUGO_ALLOW_SUBSCRIBE_FOR_CLIENT: "true"
    command: centrifugo --port=8000
    restart: unless-stopped

  postgres:
    # pgvector/pgvector ships the pgvector extension the RAG knowledge fabric
    # needs (services/ai-copilot-svc/src/rag). Same Postgres 16 underneath.
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sonalit
      POSTGRES_USER: sonalit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
