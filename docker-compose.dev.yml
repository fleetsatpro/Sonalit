services:
  centrifugo:
    image: centrifugo/centrifugo:v5
    ports:
      - "8000:8000"
    environment:
      CENTRIFUGO_TOKEN_HMAC_SECRET: ${CENTRIFUGO_TOKEN_HMAC_SECRET:-dev-secret-change-in-prod}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev-api-key-change-in-prod}
      CENTRIFUGO_ADMIN: "false"
      CENTRIFUGO_LOG_LEVEL: debug
      # false, so a subscription token is mandatory for every channel.
      #
      # With this true, any connected client could subscribe to any channel
      # whose name contains no '#' — and most of Sonalit's channels do not:
      # org:<orgId>:device:<id>:telemetry, alert:<orgId>, panic:<orgId>,
      # risk:updates:<orgId>, convoy:<id>:report. Only the '#' channels
      # (org#<orgId>, portal#<convoyId>) were protected, by Centrifugo's
      # user-limited channel rule against the connection token's 'sub'.
      #
      # Tokens for the rest are now issued by POST /realtime/subscription-token,
      # which authorizes each channel through backend/src/security/channels.js:
      # the tenant comes from the server-resolved security context and resource
      # ownership is checked under RLS. Production must set this to false too —
      # the authorization code above is inert while the broker lets clients
      # subscribe without asking.
      CENTRIFUGO_ALLOW_SUBSCRIBE_FOR_CLIENT: "false"
    command: centrifugo --port=8000
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sonalit
      POSTGRES_USER: sonalit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
